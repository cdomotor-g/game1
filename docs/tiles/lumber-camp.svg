<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 299.2 186.27" width="299.2" height="186.27" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Lumber Camp — building tile</title>
<desc>Lets you fell trees on any forest tile within 1 tile, and stores logs on site. The pair footprint is 2 cells, worked out from this building's own numbers through the ground model in data/buildingtiles.json. The picture window is bare paper: this plate has not been drawn yet, and the tile is a playable blank until it is. Generated by tools/build-tiles.mjs from data/buildingtiles.json, data/components.json, data/buildings.json and data/recipes.json - do not edit. 2 cells of 16.7 mm across the flats, which is a world-map hex on the korvane-reach four-sheet preset and a mini-map cell; 33.4 x 19.28 mm inside a 2 mm bleed, at 8 units/mm. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="cut"><path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 66.8,38.57 L 66.8,-38.57 Z" transform="translate(82.8 93.13)"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="299.2" height="186.27" fill="#EDE4D1"/>
  <g clip-path="url(#cut)">
    
  </g>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- the name, in a band on the bottom row's shoulder line - the height at
       which a pointy-top hex is still at its full width. Clipped to the cut, so
       it can never overhang a cell the tile does not own -->
  <g clip-path="url(#cut)">
    <rect x="14" y="96.96" width="271.2" height="34.74" fill="#3D3630"/>
    <text x="149.6" y="120.65" font-size="18.04" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.6" fill="#EDE4D1">LUMBER CAMP</text>
  </g>

  <!-- the die line, traced off the cells rather than drawn over them -->
  <path d="M 0,-77.13 L 66.8,-38.57 L 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- ============================================================ GRIME -->
<g id="grime" clip-path="url(#cut)">
  <g fill="#1A1714" opacity="0.05"><circle cx="196.86" cy="30.44" r="1.55"/><circle cx="208.84" cy="55.99" r="2.14"/><circle cx="23.57" cy="151.23" r="1.78"/><circle cx="239.41" cy="132.36" r="1.04"/><circle cx="154.68" cy="147.62" r="1.54"/></g><circle cx="85.47" cy="65.37" r="18.51" fill="none" stroke="#D9CBAF" stroke-width="2.4" opacity="0.4"/>
</g>
</svg>
