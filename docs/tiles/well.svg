<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165.6 186.27" width="165.6" height="186.27" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Well — building tile</title>
<desc>A town without a well or adjacent water cannot draw water at all. The single footprint is 1 cell, worked out from this building's own numbers through the ground model in data/buildingtiles.json. The window is bare paper: this plate has not been drawn yet, and the tile is a playable blank until it is. Generated by tools/build-tiles.mjs from data/buildingtiles.json, data/components.json, data/buildings.json and data/recipes.json - do not edit. 1 cell of 16.7 mm across the flats, which is a world-map hex on the korvane-reach four-sheet preset and a mini-map cell; 16.7 x 19.28 mm inside a 2 mm bleed, at 8 units/mm. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="cut-tile-well-face"><path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="165.6" height="186.27" fill="#EDE4D1"/>
  <g clip-path="url(#cut-tile-well-face)">
    
  </g>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- the name, in a band hugging the lower-right edge and running parallel to
       it. Not across the middle: a bar through a small drawing splits it into
       two unrelated halves, which is what the first version looked like -->
  <g clip-path="url(#cut-tile-well-face)">
    <path d="M 16,131.7 L 82.8,170.27 L 117.54,150.21 L 16,91.59 Z" fill="#3D3630"/>
    <g transform="rotate(30 58.08 135.94)"><text x="58.08" y="142.26" font-size="18.04" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.6" fill="#EDE4D1">WELL</text></g>
  </g>

  <!-- the die line, traced off the cells rather than drawn over them -->
  <path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- ============================================================ GRIME -->
<g id="grime" clip-path="url(#cut-tile-well-face)">
  <g fill="#1A1714" opacity="0.05"><circle cx="85.15" cy="121.14" r="1.57"/><circle cx="102.7" cy="123.52" r="1.47"/><circle cx="101.35" cy="98.94" r="1.64"/><circle cx="105.75" cy="76.89" r="0.97"/><circle cx="116.39" cy="55.24" r="1.59"/></g>
</g>
</svg>
