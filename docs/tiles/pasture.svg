<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 301.97" width="366" height="301.97" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Pasture — building tile</title>
<desc>Holds livestock. Animals breed here and can be sheared, milked or butchered. The rhombus footprint is 4 cells, worked out from this building's own numbers through the ground model in data/buildingtiles.json. The picture window is bare paper: this plate has not been drawn yet, and the tile is a playable blank until it is. Generated by tools/build-tiles.mjs from data/buildingtiles.json, data/components.json, data/buildings.json and data/recipes.json - do not edit. 4 cells of 16.7 mm across the flats, which is a world-map hex on the korvane-reach four-sheet preset and a mini-map cell; 41.75 x 33.75 mm inside a 2 mm bleed, at 8 units/mm. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="cut"><path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 66.8,38.57 L 66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 66.8,38.57 L 133.6,77.13 L 133.6,154.27 L 66.8,192.83 L 0,154.27 L 0,77.13 Z" transform="translate(82.8 93.13)"/><path d="M 200.4,38.57 L 267.2,77.13 L 267.2,154.27 L 200.4,192.83 L 133.6,154.27 L 133.6,77.13 Z" transform="translate(82.8 93.13)"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="366" height="301.97" fill="#EDE4D1"/>
  <g clip-path="url(#cut)">
    
  </g>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- the name, in a band on the bottom row's shoulder line - the height at
       which a pointy-top hex is still at its full width. Clipped to the cut, so
       it can never overhang a cell the tile does not own -->
  <g clip-path="url(#cut)">
    <rect x="14" y="96.96" width="271.2" height="34.74" fill="#3D3630"/>
    <text x="149.6" y="120.65" font-size="18.04" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.6" fill="#EDE4D1">PASTURE</text>
  </g>

  <!-- the die line, traced off the cells rather than drawn over them -->
  <path d="M 0,-77.13 L 66.8,-38.57 L 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 267.2,77.13 L 267.2,154.27 L 200.4,192.83 L 133.6,154.27 L 66.8,192.83 L 0,154.27 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- ============================================================ GRIME -->
<g id="grime" clip-path="url(#cut)">
  <g fill="#1A1714" opacity="0.05"><circle cx="268.48" cy="138.11" r="1.99"/><circle cx="55.17" cy="215.43" r="2.09"/><circle cx="28.85" cy="134.75" r="1.73"/><circle cx="161.13" cy="88.34" r="0.92"/><circle cx="234.81" cy="130.84" r="1.76"/></g><circle cx="102.84" cy="102.39" r="32.4" fill="none" stroke="#D9CBAF" stroke-width="2.4" opacity="0.4"/>
</g>
</svg>
