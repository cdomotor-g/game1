<g id="grime" clip-path="url(#cut-pasture-back)">
  <g fill="#1A1714" opacity="0.05"><circle cx="71.86" cy="269.51" r="1.83"/><circle cx="308.25" cy="284.57" r="1.31"/><circle cx="234.47" cy="18.66" r="0.99"/><circle cx="157.35" cy="195.16" r="1.36"/><circle cx="244.88" cy="32.58" r="2.16"/></g><circle cx="102.84" cy="102.39" r="32.4" fill="none" stroke="#D9CBAF" stroke-width="2.4" opacity="0.4"/>
</g>
</svg>
