<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 301.97" width="366" height="301.97" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Pasture — building tile, back</title>
<desc>The placement side. A building is laid back-up the round its work starts and stays there until the effort is paid, which is exactly when a player needs to know what ground it may stand on - so the marks are the world map's own terrain marks, from data/terrain.json. This one names 3 grounds. Generated by tools/build-tiles.mjs from data/buildingtiles.json, data/components.json, data/buildings.json and data/recipes.json - do not edit. 4 cells of 16.7 mm across the flats, which is a world-map hex on the korvane-reach four-sheet preset and a mini-map cell; 41.75 x 33.75 mm inside a 2 mm bleed, at 8 units/mm. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="cut-pasture-back"><path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 66.8,38.57 L 66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 66.8,38.57 L 133.6,77.13 L 133.6,154.27 L 66.8,192.83 L 0,154.27 L 0,77.13 Z" transform="translate(82.8 93.13)"/><path d="M 200.4,38.57 L 267.2,77.13 L 267.2,154.27 L 200.4,192.83 L 133.6,154.27 L 133.6,77.13 Z" transform="translate(82.8 93.13)"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<!-- A back has no picture. The paper is the whole wash plate. -->
<g id="wash">
  <rect x="0" y="0" width="366" height="301.97" fill="#EDE4D1"/>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <g clip-path="url(#cut-pasture-back)">
    <!-- the deck backs' own engine-turned ground, struck from the tile's centre
         so a tile put down any of six ways round reads the same -->
    <g fill="none" stroke="#1A1714" stroke-width="0.55" opacity="0.5"><circle cx="183" cy="150.98" r="21.43"/><circle cx="183" cy="150.98" r="42.85"/><circle cx="183" cy="150.98" r="64.28"/><circle cx="183" cy="150.98" r="85.71"/><circle cx="183" cy="150.98" r="107.13"/><circle cx="183" cy="150.98" r="128.56"/><circle cx="183" cy="150.98" r="149.98"/><circle cx="183" cy="150.98" r="171.41"/><circle cx="183" cy="150.98" r="192.84"/><line x1="217.71" y1="150.98" x2="375.84" y2="150.98"/><line x1="217.41" y1="155.52" x2="374.19" y2="176.15"/><line x1="216.53" y1="159.97" x2="369.27" y2="200.89"/><line x1="215.07" y1="164.27" x2="361.16" y2="224.78"/><line x1="213.06" y1="168.34" x2="350" y2="247.4"/><line x1="210.54" y1="172.11" x2="335.99" y2="268.38"/><line x1="207.54" y1="175.53" x2="319.36" y2="287.34"/><line x1="204.13" y1="178.52" x2="300.39" y2="303.97"/><line x1="200.36" y1="181.04" x2="279.42" y2="317.99"/><line x1="196.28" y1="183.05" x2="256.8" y2="329.14"/><line x1="191.98" y1="184.51" x2="232.91" y2="337.25"/><line x1="187.53" y1="185.4" x2="208.17" y2="342.17"/><line x1="183" y1="185.7" x2="183" y2="343.82"/><line x1="178.47" y1="185.4" x2="157.83" y2="342.17"/><line x1="174.02" y1="184.51" x2="133.09" y2="337.25"/><line x1="169.72" y1="183.05" x2="109.2" y2="329.14"/><line x1="165.64" y1="181.04" x2="86.58" y2="317.99"/><line x1="161.87" y1="178.52" x2="65.61" y2="303.97"/><line x1="158.46" y1="175.53" x2="46.64" y2="287.34"/><line x1="155.46" y1="172.11" x2="30.01" y2="268.38"/><line x1="152.94" y1="168.34" x2="16" y2="247.4"/><line x1="150.93" y1="164.27" x2="4.84" y2="224.78"/><line x1="149.47" y1="159.97" x2="-3.27" y2="200.89"/><line x1="148.59" y1="155.52" x2="-8.19" y2="176.15"/><line x1="148.29" y1="150.98" x2="-9.84" y2="150.98"/><line x1="148.59" y1="146.45" x2="-8.19" y2="125.81"/><line x1="149.47" y1="142" x2="-3.27" y2="101.07"/><line x1="150.93" y1="137.7" x2="4.84" y2="77.19"/><line x1="152.94" y1="133.63" x2="16" y2="54.57"/><line x1="155