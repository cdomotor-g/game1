    <!-- what ground this may stand on: the world map's own marks, never a new one -->
    <g fill="none" stroke="#1A1714" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(97.5 56.88) scale(1.22)"><path d="M6 19c0-3.6 1-6.2 3-8.2M12 19c0-5.2 0.7-8.8 2-11.6M18 19c0-3.6-1-6.2-3-8.2"/></g><g transform="translate(134.9 56.88) scale(1.22)"><path d="M2.5 17.5q4.6-7.4 9.2 0M11.6 17.5q4.6-6.4 9.2 0"/></g><g transform="translate(172.31 56.88) scale(1.22)"><path d="M12 4v16M5.2 8l13.6 8M18.8 8 5.2 16"/></g></g>
    <rect x="14" y="96.96" width="271.2" height="34.74" fill="#3D3630"/>
    <text x="149.6" y="120.65" font-size="18.04" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.6" fill="#EDE4D1">SITE</text>
  </g>
  <path d="M 0,-77.13 L 66.8,-38.57 L 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 267.2,77.13 L 267.2,154.27 L 200.4,192.83 L 133.6,154.27 L 66.8,192.83 L 0,154.27 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

