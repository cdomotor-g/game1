<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 299.2 186.27" width="299.2" height="186.27" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Sawmill — building tile, back</title>
<desc>The site side. A building is laid this way up the round its work starts and turned over when the effort is paid. It is the face's own plate with the colour run not laid on, and its name band drawn hollow: the two sides cannot drift apart because they are one picture. The pair footprint is 2 cells, worked out from this building's own numbers through the ground model in data/buildingtiles.json. The window is bare paper: this plate has not been drawn yet, and the tile is a playable blank until it is. Generated by tools/build-tiles.mjs from data/buildingtiles.json, data/components.json, data/buildings.json and data/recipes.json - do not edit. 2 cells of 16.7 mm across the flats, which is a world-map hex on the korvane-reach four-sheet preset and a mini-map cell; 33.4 x 19.28 mm inside a 2 mm bleed, at 8 units/mm. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="cut-tile-sawmill-back"><path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 66.8,38.57 L 66.8,-38.57 Z" transform="translate(82.8 93.13)"/></clipPath>
  <filter id="colour-drop" color-interpolation-filters="sRGB">
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.1 0.93"/>
      <feFuncG type="table" tableValues="0.09 0.89"/>
      <feFuncB type="table" tableValues="0.08 0.82"/>
    </feComponentTransfer>
    <feComponentTransfer>
      <feFuncR type="gamma" exponent="0.85"/>
      <feFuncG type="gamma" exponent="0.85"/>
      <feFuncB type="gamma" exponent="0.85"/>
    </feComponentTransfer>
  </filter>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="299.2" height="186.27" fill="#EDE4D1"/>
  <g clip-path="url(#cut-tile-sawmill-back)" filter="url(#colour-drop)">
    
  </g>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- the name, in a band hugging the lower-right edge and running parallel to
       it. Not across the middle: a bar through a small drawing splits it into
       two unrelated halves, which is what the first version looked like -->
  <g clip-path="url(#cut-tile-sawmill-back)">
    <path d="M 16,131.7 L 82.8,170.27 L 117.54,150.21 L 16,91.59 Z" fill="none" stroke="#3D3630" stroke-width="1.6" stroke-linejoin="round"/>
    <g transform="rotate(30 58.08 135.94)"><text x="58.08" y="140.75" font-size="13.73" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.22" fill="#3D3630">SAWMILL</text></g>
  </g>

  <!-- the die line, traced off the cells rather than drawn over them -->
  <path d="M 0,-77.13 L 66.8,-38.57 L 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- ============================================================ GRIME -->
<g id="grime" clip-path="url(#cut-tile-sawmill-back)">
  <g fill="#1A1714" opacity="0.05"><circle cx="178.29" cy="96.85" r="1.3"/><circle cx="239.72" cy="145.11" r="2.01"/><circle cx="66.65" cy="102.68" r="1.7"/><circle cx="48.58" cy="21.61" r="2.19"/><circle cx="237.13" cy="46.1" r="1.74"/></g>
</g>
</svg>
