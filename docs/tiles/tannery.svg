<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165.6 186.27" width="165.6" height="186.27" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Tannery — building tile</title>
<desc>Hide plus water into leather. Nobody wants it upwind of the town. The single footprint is 1 cell, worked out from this building's own numbers through the ground model in data/buildingtiles.json. The window is bare paper: this plate has not been drawn yet, and the tile is a playable blank until it is. Generated by tools/build-tiles.mjs from data/buildingtiles.json, data/components.json, data/buildings.json and data/recipes.json - do not edit. 1 cell of 16.7 mm across the flats, which is a world-map hex on the korvane-reach four-sheet preset and a mini-map cell; 16.7 x 19.28 mm inside a 2 mm bleed, at 8 units/mm. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="cut-tile-tannery-face"><path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="165.6" height="186.27" fill="#EDE4D1"/>
  <g clip-path="url(#cut-tile-tannery-face)">
    
  </g>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- the name, in a band hugging the lower-left edge and running parallel to
       it. Not across the middle: a bar through a small drawing splits it into
       two unrelated halves, which is what the first version looked like. The
       corner is components.json buildingTile.nameBand.edge, and lower-LEFT
       because the plates are drawn from thirty degrees to the left, which puts
       the business of the building on the right - see bandOf in lib/tiles.mjs -->
  <g clip-path="url(#cut-tile-tannery-face)">
    <path d="M 16,131.7 L 82.8,170.27 L 117.54,150.21 L 16,91.59 Z" fill="#3D3630"/>
    <g transform="rotate(30 58.08 135.94)"><text x="58.08" y="140.75" font-size="13.73" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.22" fill="#EDE4D1">TANNERY</text></g>
  </g>

  <!-- the die line, traced off the cells rather than drawn over them -->
  <path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- ============================================================ GRIME -->
<g id="grime" clip-path="url(#cut-tile-tannery-face)">
  <g fill="#1A1714" opacity="0.05"><circle cx="27.74" cy="146.05" r="1.7"/><circle cx="58.97" cy="48.66" r="1.34"/><circle cx="84.85" cy="73.05" r="1.47"/><circle cx="43.35" cy="115.53" r="1.66"/><circle cx="49.77" cy="84.66" r="0.84"/></g>
</g>
</svg>
