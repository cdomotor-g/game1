<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165.6 186.27" width="165.6" height="186.27" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Well — building tile, back</title>
<desc>The placement side. A building is laid back-up the round its work starts and stays there until the effort is paid, which is exactly when a player needs to know what ground it may stand on - so the marks are the world map's own terrain marks, from data/terrain.json. This one names none: it stands on whatever is under it. Generated by tools/build-tiles.mjs from data/buildingtiles.json, data/components.json, data/buildings.json and data/recipes.json - do not edit. 1 cell of 16.7 mm across the flats, which is a world-map hex on the korvane-reach four-sheet preset and a mini-map cell; 16.7 x 19.28 mm inside a 2 mm bleed, at 8 units/mm. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="cut"><path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<!-- A back has no picture. The paper is the whole wash plate. -->
<g id="wash">
  <rect x="0" y="0" width="165.6" height="186.27" fill="#EDE4D1"/>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <g clip-path="url(#cut)">
    <!-- the deck backs' own engine-turned ground, struck from the tile's centre
         so a tile put down any of six ways round reads the same -->
