    <!-- what ground this may stand on: the world map's own marks, never a new one -->
    
    <rect x="14" y="96.96" width="137.6" height="34.74" fill="#3D3630"/>
    <text x="82.8" y="120.65" font-size="18.04" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.6" fill="#EDE4D1">SITE</text>
  </g>
  <path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- ============================================================ GRIME -->
<g id="grime" clip-path="url(#cut)">
  <g fill="#1A1714" opacity="0.05"><circle cx="70.44" cy="166.18" r="0.93"/><circle cx="141.38" cy="107.26" r="1.17"/><circle cx="97.82" cy="59.41" r="2.04"/><circle cx="112.49" cy="94.48" r="2.05"/><circle cx="33.97" cy="49.21" r="1.89"/></g><circle cx="50.74" cy="65.37" r="16.03" fill="none" stroke="#D9CBAF" stroke-width="2.4" opacity="0.4"/>
