<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 299.2 186.27" width="299.2" height="186.27" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Clay Pit — building tile</title>
<desc>Digs clay from marshes, river banks and wet ground. The pair footprint is 2 cells, worked out from this building's own numbers through the ground model in data/buildingtiles.json. Generated by tools/build-tiles.mjs from data/buildingtiles.json, data/components.json, data/buildings.json and data/recipes.json - do not edit. 2 cells of 16.7 mm across the flats, which is a world-map hex on the korvane-reach four-sheet preset and a mini-map cell; 33.4 x 19.28 mm inside a 2 mm bleed, at 8 units/mm. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="cut-tile-clay-pit-face"><path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 66.8,38.57 L 66.8,-38.57 Z" transform="translate(82.8 93.13)"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="299.2" height="186.27" fill="#EDE4D1"/>
  <g clip-path="url(#cut-tile-clay-pit-face)">
    <image href="../art/renders/tile-clay-pit.png" x="16" y="-1.1" width="267.2" height="178.13" preserveAspectRatio="none"/>
  </g>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- the name, in a band hugging the lower-left edge and running parallel to
       it. Not across the middle: a bar through a small drawing splits it into
       two unrelated halves, which is what the first version looked like. The
       corner is components.json buildingTile.nameBand.edge, and lower-LEFT
       because the plates are drawn from thirty degrees to the left, which puts
       the business of the building on the right - see bandOf in lib/tiles.mjs -->
  <g clip-path="url(#cut-tile-clay-pit-face)">
    <path d="M 16,131.7 L 82.8,170.27 L 117.54,150.21 L 16,91.59 Z" fill="#3D3630"/>
    <g transform="rotate(30 58.08 135.94)"><text x="58.08" y="140.15" font-size="12.01" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.07" fill="#EDE4D1">CLAY PIT</text></g>
  </g>

  <!-- the die line, traced off the cells rather than drawn over them -->
  <path d="M 0,-77.13 L 66.8,-38.57 L 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- ============================================================ GRIME -->
<g id="grime" clip-path="url(#cut-tile-clay-pit-face)">
  <g fill="#1A1714" opacity="0.05"><circle cx="187.17" cy="89.9" r="1"/><circle cx="166.15" cy="136.23" r="0.84"/><circle cx="113.13" cy="30.6" r="0.88"/><circle cx="164.81" cy="38.86" r="1.97"/><circle cx="135.09" cy="97.76" r="0.89"/></g>
</g>
</svg>
