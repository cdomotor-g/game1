<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 299.2 301.97" width="299.2" height="301.97" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Barracks — building tile</title>
<desc>Turns fed workers into soldiers, and holds them without them costing you effort. The triad footprint is 3 cells, worked out from this building's own numbers through the ground model in data/buildingtiles.json. The window is bare paper: this plate has not been drawn yet, and the tile is a playable blank until it is. Generated by tools/build-tiles.mjs from data/buildingtiles.json, data/components.json, data/buildings.json and data/recipes.json - do not edit. 3 cells of 16.7 mm across the flats, which is a world-map hex on the korvane-reach four-sheet preset and a mini-map cell; 33.4 x 33.75 mm inside a 2 mm bleed, at 8 units/mm. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="cut-tile-barracks"><path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 66.8,38.57 L 66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 66.8,38.57 L 133.6,77.13 L 133.6,154.27 L 66.8,192.83 L 0,154.27 L 0,77.13 Z" transform="translate(82.8 93.13)"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="299.2" height="301.97" fill="#EDE4D1"/>
  <g clip-path="url(#cut-tile-barracks)">
    
  </g>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- the name, in a band hugging the lower-right edge and running parallel to
       it. Not across the middle: a bar through a small drawing splits it into
       two unrelated halves, which is what the first version looked like -->
  <g clip-path="url(#cut-tile-barracks)">
    <path d="M 149.6,285.97 L 216.4,247.4 L 216.4,207.29 L 114.86,265.91 Z" fill="#3D3630"/>
    <g transform="rotate(-30 174.32 251.64)"><text x="174.32" y="255.85" font-size="12.01" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.07" fill="#EDE4D1">BARRACKS</text></g>
  </g>

  <!-- the die line, traced off the cells rather than drawn over them -->
  <path d="M 0,-77.13 L 66.8,-38.57 L 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 133.6,154.27 L 66.8,192.83 L 0,154.27 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- ============================================================ GRIME -->
<g id="grime" clip-path="url(#cut-tile-barracks)">
  <g fill="#1A1714" opacity="0.05"><circle cx="52.8" cy="130.91" r="2.1"/><circle cx="42.49" cy="168.6" r="1.8"/><circle cx="122.71" cy="25.45" r="1.59"/><circle cx="165.65" cy="160.02" r="1.37"/><circle cx="76.26" cy="123.1" r="1.76"/></g>
</g>
</svg>
