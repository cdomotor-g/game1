<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 299.2 301.97" width="299.2" height="301.97" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Oil Derrick — building tile</title>
<desc>Late-game. Pumps crude oil out of an oil field. The triad footprint is 3 cells, worked out from this building's own numbers through the ground model in data/buildingtiles.json. The window is bare paper: this plate has not been drawn yet, and the tile is a playable blank until it is. Generated by tools/build-tiles.mjs from data/buildingtiles.json, data/components.json, data/buildings.json and data/recipes.json - do not edit. 3 cells of 16.7 mm across the flats, which is a world-map hex on the korvane-reach four-sheet preset and a mini-map cell; 33.4 x 33.75 mm inside a 2 mm bleed, at 8 units/mm. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="cut-tile-oil-derrick"><path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 66.8,38.57 L 66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 66.8,38.57 L 133.6,77.13 L 133.6,154.27 L 66.8,192.83 L 0,154.27 L 0,77.13 Z" transform="translate(82.8 93.13)"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="299.2" height="301.97" fill="#EDE4D1"/>
  <g clip-path="url(#cut-tile-oil-derrick)">
    
  </g>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- the name, in a band hugging the lower-right edge and running parallel to
       it. Not across the middle: a bar through a small drawing splits it into
       two unrelated halves, which is what the first version looked like -->
  <g clip-path="url(#cut-tile-oil-derrick)">
    <path d="M 149.6,285.97 L 216.4,247.4 L 216.4,207.29 L 114.86,265.91 Z" fill="#3D3630"/>
    <g transform="rotate(-30 174.32 251.64)"><text x="174.32" y="256.45" font-size="13.73" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.22" fill="#EDE4D1">DERRICK</text></g>
  </g>

  <!-- the die line, traced off the cells rather than drawn over them -->
  <path d="M 0,-77.13 L 66.8,-38.57 L 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 133.6,154.27 L 66.8,192.83 L 0,154.27 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- ============================================================ GRIME -->
<g id="grime" clip-path="url(#cut-tile-oil-derrick)">
  <g fill="#1A1714" opacity="0.05"><circle cx="99.49" cy="265.89" r="1.18"/><circle cx="137.99" cy="254.48" r="1.62"/><circle cx="156.63" cy="228.64" r="1.15"/><circle cx="50.43" cy="199.8" r="1.98"/><circle cx="115.8" cy="102.01" r="1.86"/></g><circle cx="85.47" cy="102.39" r="32.06" fill="none" stroke="#D9CBAF" stroke-width="2.4" opacity="0.4"/>
</g>
</svg>
