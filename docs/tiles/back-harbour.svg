<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 299.2 301.97" width="299.2" height="301.97" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Harbour — building tile, back</title>
<desc>The placement side. A building is laid back-up the round its work starts and stays there until the effort is paid, which is exactly when a player needs to know what ground it may stand on - so the marks are the world map's own terrain marks, from data/terrain.json. This one names 1 ground. Generated by tools/build-tiles.mjs from data/buildingtiles.json, data/components.json, data/buildings.json and data/recipes.json - do not edit. 3 cells of 16.7 mm across the flats, which is a world-map hex on the korvane-reach four-sheet preset and a mini-map cell; 33.4 x 33.75 mm inside a 2 mm bleed, at 8 units/mm. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="cut-harbour-back"><path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 66.8,38.57 L 66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 66.8,38.57 L 133.6,77.13 L 133.6,154.27 L 66.8,192.83 L 0,154.27 L 0,77.13 Z" transform="translate(82.8 93.13)"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<!-- A back has no picture. The paper is the whole wash plate. -->
<g id="wash">
  <rect x="0" y="0" width="299.2" height="301.97" fill="#EDE4D1"/>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <g clip-path="url(#cut-harbour-back)">
    <!-- the deck backs' own engine-turned ground, struck from the tile's centre
         so a tile put down any of six ways round reads the same -->
    <g fill="none" stroke="#1A1714" stroke-width="0.55" opacity="0.5"><circle cx="149.6" cy="150.98" r="18.31"/><circle cx="149.6" cy="150.98" r="36.61"/><circle cx="149.6" cy="150.98" r="54.92"/><circle cx="149.6" cy="150.98" r="73.23"/><circle cx="149.6" cy="150.98" r="91.53"/><circle cx="149.6" cy="150.98" r="109.84"/><circle cx="149.6" cy="150.98" r="128.15"/><circle cx="149.6" cy="150.98" r="146.45"/><circle cx="149.6" cy="150.98" r="164.76"/><line x1="179.26" y1="150.98" x2="314.36" y2="150.98"/><line x1="179" y1="154.86" x2="312.95" y2="172.49"/><line x1="178.25" y1="158.66" x2="308.75" y2="193.63"/><line x1="177" y1="162.33" x2="301.82" y2="214.04"/><line x1="175.28" y1="165.81" x2="292.29" y2="233.36"/><line x1="173.13" y1="169.04" x2="280.31" y2="251.28"/><line x1="170.57" y1="171.96" x2="266.1" y2="267.49"/><line x1="167.65" y1="174.51" x2="249.9" y2="281.7"/><line x1="164.43" y1="176.67" x2="231.98" y2="293.67"/><line x1="160.95" y1="178.38" x2="212.65" y2="303.2"/><line x1="157.28" y1="179.63" x2="192.24" y2="310.13"/><line x1="153.47" y1="180.39" x2="171.11" y2="314.33"/><line x1="149.6" y1="180.64" x2="149.6" y2="315.74"/><line x1="145.73" y1="180.39" x2="128.09" y2="314.33"/><line x1="141.92" y1="179.63" x2="106.96" y2="310.13"/><line x1="138.25" y1="178.38" x2="86.55" y2="303.2"/><line x1="134.77" y1="176.67" x2="67.22" y2="293.67"/><line x1="131.55" y1="174.51" x2="49.3" y2="281.7"/><line x1="128.63" y1="171.96" x2="33.1" y2="267.49"/><line x1="126.07" y1="169.04" x2="18.89" y2="251.28"/><line x1="123.92" y1="165.81" x2="6.91" y2="233.36"/><line x1="122.2" y1="162.33" x2="-2.62" y2="214.04"/><line x1="120.95" y1="158.66" x2="-9.55" y2="193.63"/><line x1="120.2" y1="154.86" x2="-13.75" y2="172.49"/><line x1="119.94" y1="150.98" x2="-15.16" y2="150.98"/><line x1="120.2" y1="147.11" x2="-13.75" y2="129.48"/><line x1="120.95" y1="143.31" x2="-9.55" y2="108.34"/><line x1="122.2" y1="139.64" x2="-2.62" y2="87.93"/><line x1="123.92" y1="136.16" x2="6.91" 