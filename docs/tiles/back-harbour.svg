    <!-- what ground this may stand on: the world map's own marks, never a new one -->
    <g fill="none" stroke="#1A1714" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(134.9 56.88) scale(1.22)"><path d="M2 8.6q5-3.4 10 0t10 0M5.6 15.4h4.8M13.6 15.4h4.8"/></g></g>
    <rect x="14" y="96.96" width="271.2" height="34.74" fill="#3D3630"/>
    <text x="149.6" y="120.65" font-size="18.04" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.6" fill="#EDE4D1">SITE</text>
  </g>
  <path d="M 0,-77.13 L 66.8,-38.57 L 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 133.6,154.27 L 66.8,192.83 L 0,154.27 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- ============================================================ GRIME -->
<g id="grime" clip-path="url(#cut-harbour-back)">
  <g fill="#1A1714" opacity="0.05"><circle cx="232.58" cy="199.45" r="1.01"/><circle cx="122.71" cy="151.95" r="1.72"/><circle cx="256.46" cy="129.26" r="2.19"/><circle cx="120.6" cy="169.62" r="1.93"/><circle cx="171.31" cy="118.81" r="1.84"/></g><circle cx="85.47" cy="102.39" r="32.06" fill="none" stroke="#D9CBAF" stroke-width="2.4" opacity="0.4"/>
