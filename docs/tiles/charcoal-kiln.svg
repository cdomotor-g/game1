<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165.6 186.27" width="165.6" height="186.27" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Charcoal Kiln — building tile</title>
<desc>Logs into charcoal, for smelting where there is no coal. The single footprint is 1 cell, worked out from this building's own numbers through the ground model in data/buildingtiles.json. The picture window is bare paper: this plate has not been drawn yet, and the tile is a playable blank until it is. Generated by tools/build-tiles.mjs from data/buildingtiles.json, data/components.json, data/buildings.json and data/recipes.json - do not edit. 1 cell of 16.7 mm across the flats, which is a world-map hex on the korvane-reach four-sheet preset and a mini-map cell; 16.7 x 19.28 mm inside a 2 mm bleed, at 8 units/mm. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="cut-charcoal-kiln"><path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="165.6" height="186.27" fill="#EDE4D1"/>
  <g clip-path="url(#cut-charcoal-kiln)">
    
  </g>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- the name, in a band on the bottom row's shoulder line - the height at
       which a pointy-top hex is still at its full width. Clipped to the cut, so
       it can never overhang a cell the tile does not own -->
  <g clip-path="url(#cut-charcoal-kiln)">
    <rect x="14" y="96.96" width="137.6" height="34.74" fill="#3D3630"/>
    <text x="82.8" y="120.65" font-size="18.04" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.6" fill="#EDE4D1">KILN</text>
  </g>

  <!-- the die line, traced off the cells rather than drawn over them -->
  <path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- ============================================================ GRIME -->
<g id="grime" clip-path="url(#cut-charcoal-kiln)">
  <g fill="#1A1714" opacity="0.05"><circle cx="43.06" cy="95.44" r="1.24"/><circle cx="109.1" cy="139.05" r="2.05"/><circle cx="105.37" cy="78.45" r="1.67"/><circle cx="20.76" cy="142.83" r="0.91"/><circle cx="98.47" cy="143.01" r="1.25"/></g><circle cx="50.74" cy="65.37" r="16.03" fill="none" stroke="#D9CBAF" stroke-width="2.4" opacity="0.4"/>
</g>
</svg>
