<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165.6 186.27" width="165.6" height="186.27" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Flax Field — building tile, back</title>
<desc>The sown side. A field is laid this way up the round it is sown and turned over when it ripens. It is the face's own plate with the colour run not laid on, and its name band drawn hollow: the two sides cannot drift apart because they are one picture. The single footprint is 1 cell, worked out from this crop own numbers through the ground model in data/buildingtiles.json. Generated by tools/build-tiles.mjs from data/buildingtiles.json, data/components.json, data/buildings.json and data/recipes.json - do not edit. 1 cell of 16.7 mm across the flats, which is a world-map hex on the korvane-reach four-sheet preset and a mini-map cell; 16.7 x 19.28 mm inside a 2 mm bleed, at 8 units/mm. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="cut-tile-crop-flax-back"><path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)"/></clipPath>
  <filter id="colour-drop" color-interpolation-filters="sRGB">
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.1 0.93"/>
      <feFuncG type="table" tableValues="0.09 0.89"/>
      <feFuncB type="table" tableValues="0.08 0.82"/>
    </feComponentTransfer>
    <feComponentTransfer>
      <feFuncR type="gamma" exponent="0.85"/>
      <feFuncG type="gamma" exponent="0.85"/>
      <feFuncB type="gamma" exponent="0.85"/>
    </feComponentTransfer>
  </filter>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="165.6" height="186.27" fill="#EDE4D1"/>
  <g clip-path="url(#cut-tile-crop-flax-back)" filter="url(#colour-drop)">
    <image href="../art/renders/tile-crop-flax.png" x="6.08" y="16" width="154.27" height="154.27" preserveAspectRatio="none"/>
  </g>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- the name, in a band hugging the lower-left edge and running parallel to
       it. Not across the middle: a bar through a small drawing splits it into
       two unrelated halves, which is what the first version looked like. The
       corner is components.json buildingTile.nameBand.edge, and lower-LEFT
       because the plates are drawn from thirty degrees to the left, which puts
       the business of the building on the right - see bandOf in lib/tiles.mjs -->
  <g clip-path="url(#cut-tile-crop-flax-back)">
    <path d="M 16,131.7 L 82.8,170.27 L 117.54,150.21 L 16,91.59 Z" fill="none" stroke="#3D3630" stroke-width="1.6" stroke-linejoin="round"/>
    <g transform="rotate(30 58.08 135.94)"><text x="58.08" y="142.26" font-size="18.04" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.6" fill="#3D3630">FLAX</text></g>
  </g>

  <!-- the die line, traced off the cells rather than drawn over them -->
  <path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- ============================================================ GRIME -->
<g id="grime" clip-path="url(#cut-tile-crop-flax-back)">
  <g fill="#1A1714" opacity="0.05"><circle cx="118.19" cy="83.97" r="1.1"/><circle cx="146.07" cy="45.24" r="1.1"/><circle cx="68.32" cy="157.92" r="2.12"/><circle cx="30.48" cy="111.21" r="0.9"/><circle cx="116.56" cy="137.65" r="1.39"/></g>
</g>
</svg>
