    <!-- what ground this may stand on: the world map's own marks, never a new one -->
    <g fill="none" stroke="#1A1714" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(116.2 56.88) scale(1.22)"><path d="M2.5 17.5q4.6-7.4 9.2 0M11.6 17.5q4.6-6.4 9.2 0"/></g><g transform="translate(153.61 56.88) scale(1.22)"><path d="M2 19 9 7.6l4.4 6.8 3-4.4L22 19z"/></g></g>
    <rect x="14" y="96.96" width="271.2" height="34.74" fill="#3D3630"/>
    <text x="149.6" y="120.65" font-size="18.04" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.6" fill="#EDE4D1">SITE</text>
  </g>
  <path d="M 0,-77.13 L 66.8,-38.57 L 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

