<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 299.2 186.27" width="299.2" height="186.27" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Vineyard — building tile</title>
<desc>Grapes only, and only on sun-facing ground. The pair footprint is 2 cells, worked out from this building's own numbers through the ground model in data/buildingtiles.json. The window is bare paper: this plate has not been drawn yet, and the tile is a playable blank until it is. Generated by tools/build-tiles.mjs from data/buildingtiles.json, data/components.json, data/buildings.json and data/recipes.json - do not edit. 2 cells of 16.7 mm across the flats, which is a world-map hex on the korvane-reach four-sheet preset and a mini-map cell; 33.4 x 19.28 mm inside a 2 mm bleed, at 8 units/mm. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="cut-tile-vineyard"><path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 66.8,38.57 L 66.8,-38.57 Z" transform="translate(82.8 93.13)"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="299.2" height="186.27" fill="#EDE4D1"/>
  <g clip-path="url(#cut-tile-vineyard)">
    
  </g>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- the name, in a band hugging the lower-right edge and running parallel to
       it. Not across the middle: a bar through a small drawing splits it into
       two unrelated halves, which is what the first version looked like -->
  <g clip-path="url(#cut-tile-vineyard)">
    <path d="M 216.4,170.27 L 283.2,131.7 L 283.2,91.59 L 181.66,150.21 Z" fill="#3D3630"/>
    <g transform="rotate(-30 241.12 135.94)"><text x="241.12" y="140.15" font-size="12.01" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.07" fill="#EDE4D1">VINEYARD</text></g>
  </g>

  <!-- the die line, traced off the cells rather than drawn over them -->
  <path d="M 0,-77.13 L 66.8,-38.57 L 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- ============================================================ GRIME -->
<g id="grime" clip-path="url(#cut-tile-vineyard)">
  <g fill="#1A1714" opacity="0.05"><circle cx="43.44" cy="87.03" r="1.62"/><circle cx="17.02" cy="151.82" r="2.03"/><circle cx="31.96" cy="133.98" r="2.08"/><circle cx="223.77" cy="105.02" r="1.9"/><circle cx="32.26" cy="163.55" r="1.48"/></g><circle cx="85.47" cy="65.37" r="18.51" fill="none" stroke="#D9CBAF" stroke-width="2.4" opacity="0.4"/>
</g>
</svg>
