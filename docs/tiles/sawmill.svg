<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 299.2 301.97" width="299.2" height="301.97" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Sawmill — building tile</title>
<desc>Logs into lumber. Doubles its rate on a waterside tile - water drives the saw. The triad footprint is 3 cells, worked out from this building's own numbers through the ground model in data/buildingtiles.json. Generated by tools/build-tiles.mjs from data/buildingtiles.json, data/components.json, data/buildings.json and data/recipes.json - do not edit. 3 cells of 16.7 mm across the flats, which is a world-map hex on the korvane-reach four-sheet preset and a mini-map cell; 33.4 x 33.75 mm inside a 2 mm bleed, at 8 units/mm. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="cut-tile-sawmill-face"><path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 66.8,38.57 L 66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 66.8,38.57 L 133.6,77.13 L 133.6,154.27 L 66.8,192.83 L 0,154.27 L 0,77.13 Z" transform="translate(82.8 93.13)"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="299.2" height="301.97" fill="#EDE4D1"/>
  <g clip-path="url(#cut-tile-sawmill-face)">
    <image href="../art/renders/tile-sawmill.png" x="16" y="16" width="269.97" height="269.97" preserveAspectRatio="none"/>
  </g>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- the name, in a band hugging the lower-left edge and running parallel to
       it. Not across the middle: a bar through a small drawing splits it into
       two unrelated halves, which is what the first version looked like. The
       corner is components.json buildingTile.nameBand.edge, and lower-LEFT
       because the plates are drawn from thirty degrees to the left, which puts
       the business of the building on the right - see bandOf in lib/tiles.mjs -->
  <g clip-path="url(#cut-tile-sawmill-face)">
    <path d="M 82.8,247.4 L 149.6,285.97 L 184.34,265.91 L 82.8,207.29 Z" fill="#3D3630"/>
    <g transform="rotate(30 124.88 251.64)"><text x="124.88" y="256.45" font-size="13.73" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.22" fill="#EDE4D1">SAWMILL</text></g>
  </g>

  <!-- the die line, traced off the cells rather than drawn over them -->
  <path d="M 0,-77.13 L 66.8,-38.57 L 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 133.6,154.27 L 66.8,192.83 L 0,154.27 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- ============================================================ GRIME -->
<g id="grime" clip-path="url(#cut-tile-sawmill-face)">
  <g fill="#1A1714" opacity="0.05"><circle cx="178.29" cy="157.49" r="1.3"/><circle cx="239.72" cy="241.94" r="2.01"/><circle cx="66.65" cy="167.69" r="1.7"/><circle cx="48.58" cy="25.81" r="2.19"/><circle cx="237.13" cy="68.67" r="1.74"/></g>
</g>
</svg>
