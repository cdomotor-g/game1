<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 299.2 301.97" width="299.2" height="301.97" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Granary — building tile</title>
<desc>Ten slots for food and drink only - and food inside it does not perish. The triad footprint is 3 cells, worked out from this building's own numbers through the ground model in data/buildingtiles.json. The picture window is bare paper: this plate has not been drawn yet, and the tile is a playable blank until it is. Generated by tools/build-tiles.mjs from data/buildingtiles.json, data/components.json, data/buildings.json and data/recipes.json - do not edit. 3 cells of 16.7 mm across the flats, which is a world-map hex on the korvane-reach four-sheet preset and a mini-map cell; 33.4 x 33.75 mm inside a 2 mm bleed, at 8 units/mm. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="cut-granary"><path d="M 0,-77.13 L 66.8,-38.57 L 66.8,38.57 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 66.8,38.57 L 66.8,-38.57 Z" transform="translate(82.8 93.13)"/><path d="M 66.8,38.57 L 133.6,77.13 L 133.6,154.27 L 66.8,192.83 L 0,154.27 L 0,77.13 Z" transform="translate(82.8 93.13)"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="299.2" height="301.97" fill="#EDE4D1"/>
  <g clip-path="url(#cut-granary)">
    
  </g>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- the name, in a band on the bottom row's shoulder line - the height at
       which a pointy-top hex is still at its full width. Clipped to the cut, so
       it can never overhang a cell the tile does not own -->
  <g clip-path="url(#cut-granary)">
    <rect x="14" y="96.96" width="271.2" height="34.74" fill="#3D3630"/>
    <text x="149.6" y="120.65" font-size="18.04" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" letter-spacing="1.6" fill="#EDE4D1">GRANARY</text>
  </g>

  <!-- the die line, traced off the cells rather than drawn over them -->
  <path d="M 0,-77.13 L 66.8,-38.57 L 133.6,-77.13 L 200.4,-38.57 L 200.4,38.57 L 133.6,77.13 L 133.6,154.27 L 66.8,192.83 L 0,154.27 L 0,77.13 L -66.8,38.57 L -66.8,-38.57 Z" transform="translate(82.8 93.13)" fill="none" stroke="#1A1714" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- ============================================================ GRIME -->
<g id="grime" clip-path="url(#cut-granary)">
  <g fill="#1A1714" opacity="0.05"><circle cx="282.09" cy="189.2" r="1.74"/><circle cx="95.17" cy="253.31" r="1.24"/><circle cx="116.5" cy="17.6" r="2.03"/><circle cx="25.96" cy="128.13" r="1.2"/><circle cx="87.98" cy="156.96" r="1.12"/></g><circle cx="85.47" cy="102.39" r="32.06" fill="none" stroke="#D9CBAF" stroke-width="2.4" opacity="0.4"/>
</g>
</svg>
