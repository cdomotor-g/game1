<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>game1 — design explorer</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1>game1</h1>
      <p class="brand-sub">design explorer &amp; prototype</p>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="topbar-actions">
    <input type="search" id="global-search" placeholder="Search everything…" aria-label="Search" autocomplete="off">
    <button id="theme-toggle" class="icon-btn" title="Toggle light/dark" aria-label="Toggle theme">◐</button>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-inner">
    <button class="drawer-close" id="drawer-close" aria-label="Close">×</button>
    <div id="drawer-body"></div>
  </div>
</div>

<footer class="footer">
  <span id="footer-stats"></span>
  <span class="footer-note">
    Data is generated from <code>data/*.json</code> — run <code>node tools/build-data.mjs</code> after editing.
  </span>
</footer>

<script src="data/bundle.js"></script>
<script src="js/ui.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/views.js"></script>
<script src="js/sandbox.js"></script>
<script src="js/app.js"></script>
</body>
</html>
