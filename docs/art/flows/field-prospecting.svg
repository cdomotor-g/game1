<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 184" font-family="Georgia, 'Times New Roman', serif">
<defs><marker id="f-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5F564C"/></marker></defs>
<rect width="780" height="184" fill="#EDE4D1"/>
<text x="16" y="24" font-size="15" font-weight="bold" fill="#1A1714">Afield with a figure</text><text x="16" y="40" font-size="8.5" fill="#3D3630">Work done by a figure standing on the map rather than by a settlement.</text>
<g><rect x="16" y="73" width="116.06" height="18" rx="4" fill="none" stroke="#C0B7A9" stroke-width="1"/><text x="23" y="85.5" font-size="9" fill="#1A1714">nothing but the hours</text></g>
<g class="f-token" data-kind="recipes" data-id="survey-deposit"><rect x="300" y="58" width="220" height="48" rx="5" fill="#e2cbb7" stroke="#A33B26" stroke-width="1.3"/><text x="410" y="72" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1A1714">Survey</text><text x="410" y="84" text-anchor="middle" font-size="8" fill="#3D3630">1h effort · needs Surveyor's Kit</text><text x="410" y="95" text-anchor="middle" font-size="8" fill="#3D3630">with the Prospector</text></g>
<line x1="524" y1="82" x2="548" y2="61" stroke="#5F564C" stroke-width="0.8" marker-end="url(#f-arrow)"/>
<text x="552" y="64" font-size="8.5" fill="#1A1714">roll a d6 — see its table</text>
<text x="552" y="79" font-size="7.5" font-style="italic" fill="#5F564C">On the prospector's current tile, roll the</text>
<text x="552" y="88" font-size="7.5" font-style="italic" fill="#5F564C">survey die. On a success, place the</text>
<text x="552" y="97" font-size="7.5" font-style="italic" fill="#5F564C">deposit token face up - it is now minable</text>
<text x="552" y="106" font-size="7.5" font-style="italic" fill="#5F564C">by whoever builds there first.</text>
<line x1="16" y1="114" x2="764" y2="114" stroke="#C0B7A9" stroke-width="0.6"/>
<g><rect x="16" y="135" width="116.06" height="18" rx="4" fill="none" stroke="#C0B7A9" stroke-width="1"/><text x="23" y="147.5" font-size="9" fill="#1A1714">nothing but the hours</text></g>
<g class="f-token" data-kind="recipes" data-id="plan-route"><rect x="300" y="120" width="220" height="48" rx="5" fill="#e2cbb7" stroke="#A33B26" stroke-width="1.3"/><text x="410" y="134" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1A1714">Plan Route</text><text x="410" y="146" text-anchor="middle" font-size="8" fill="#3D3630">2h effort · needs Surveyor's Kit</text><text x="410" y="157" text-anchor="middle" font-size="8" fill="#3D3630">with the Prospector</text></g>
<text x="552" y="137.5" font-size="7.5" font-style="italic" fill="#5F564C">Mark a surveyed line across up to 3 tiles.</text>
<text x="552" y="146.5" font-size="7.5" font-style="italic" fill="#5F564C">Road or rail built along it costs 1 less</text>
<text x="552" y="155.5" font-size="7.5" font-style="italic" fill="#5F564C">build-point per tile.</text>
</svg>