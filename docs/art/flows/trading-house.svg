<g class="f-token" data-kind="recipes" data-id="broker-trade"><rect x="300" y="71" width="220" height="48" rx="5" fill="#e2cbb7" stroke="#A33B26" stroke-width="1.3"/><text x="410" y="85" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1A1714">Broker a Trade</text><text x="410" y="97" text-anchor="middle" font-size="8" fill="#3D3630">1h effort</text><text x="410" y="108" text-anchor="middle" font-size="8" fill="#3D3630">by a Merchant</text></g>
<text x="552" y="75" font-size="7.5" font-style="italic" fill="#5F564C">Trade any quantity with any player whose</text>
<text x="552" y="84" font-size="7.5" font-style="italic" fill="#5F564C">merchant or trading house is connected to</text>
<text x="552" y="93" font-size="7.5" font-style="italic" fill="#5F564C">this town by a route, at whatever price</text>
<text x="552" y="102" font-size="7.5" font-style="italic" fill="#5F564C">you agree. No spread. You may also broker</text>
