<title>Chain Mail — the plate</title>
<desc>Chain Mail: A knee-length hauberk of riveted rings, short-sleeved, split at the hem for riding, with a leather collar. Generated by tools/draw-item.mjs from data/items.json and data/components.json itemPlate — do not edit. The object is drawn into the box components.json calls itemPlate.subject, which is what docs/art/framing.json says about this plate. The ink plate alone is the black-and-white edition.</desc>
