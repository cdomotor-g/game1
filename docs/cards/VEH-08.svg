  <!-- the card's working text -->
  <g font-size="18">
    <text x="90" y="489" font-size="18" >Broad marsh-rigged wheels: may cross marsh</text>
    <text x="90" y="511" font-size="18" >at 1 hex per leg, which no other wheeled</text>
    <text x="90" y="533" font-size="18" >thing can do at all.</text>
  </g>
  <path d="M 48,613.5 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="635.5" font-size="16.5" >Wide-wheeled, willow-sprung, waterproofed with fen pitch.</text>
    <text x="50" y="655" font-size="16.5" >The Fenway crews sell the safe road through the Mirewash,</text>
    <text x="50" y="674.5" font-size="16.5" >and the toll is knowing which tussocks are lying.</text>
  </g>
