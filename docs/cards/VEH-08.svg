<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 752" width="552" height="752" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>The Fenway Wagons — VEH-08</title>
<desc>Vehicle card: The Fenway Wagons (caravan). Hull 6, 20 bulk of hold. Generated by tools/build-cards.mjs from data/*.json — do not edit. 63x88mm at 8 units/mm, 3mm bleed. Every number is a printed maximum in the summary strip; nothing on this card is walked by a token, because the tracks are on the player board. The portrait is cropped on the plate's subject, from docs/art/framing.json. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="portrait-window"><rect x="48" y="169" width="456" height="329"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="552" height="752" fill="#EDE4D1"/>
  <g clip-path="url(#portrait-window)">
    <image href="../art/renders/vehicle-veh-08.png" x="26.78" y="169" width="493.5" height="329" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="48" y="106" width="71.83" height="36.8" rx="4" fill="#A33B26" opacity="0.55"/><rect x="124.83" y="106" width="71.83" height="36.8" rx="4" fill="#3C5A6E" opacity="0.55"/>
  <rect x="24" y="590" width="504" height="140" fill="#D8CEBE" opacity="0.5"/>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- timber-and-iron frame, rivets at the corners. Both rules follow the card's
       own corner radius, one inside the other, or the frame reads as a square
       box floating in a rounded card. -->
  <g fill="none" stroke="#1A1714">
    <rect x="32" y="32" width="488" height="688" rx="20" stroke-width="4"/>
    <rect x="40" y="40" width="472" height="672" rx="12" stroke-width="1.2"/>
  </g>
  <g><circle cx="47.4" cy="47.4" r="3.6"/><circle cx="504.6" cy="47.4" r="3.6"/><circle cx="47.4" cy="704.6" r="3.6"/><circle cx="504.6" cy="704.6" r="3.6"/></g>

  <!-- name and card code, maker's-mark small -->
  <text x="48" y="80" font-size="31" font-weight="bold">The Fenway Wagons</text>
  <text x="504" y="52" font-size="15" text-anchor="end" letter-spacing="2" font-family="Helvetica, Arial, sans-serif">VEH-08</text>
  <text x="48" y="98" font-size="15.5" font-style="italic" fill="#3D3630">caravan</text>

  <!-- the summary strip: every number this card has, and none of them moves -->
  <rect x="48" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><text x="53" y="131.6" font-size="20" font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#5F564C">H</text><text x="114.83" y="132.32" font-size="22" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">6</text><rect x="124.83" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><text x="129.83" y="131.6" font-size="20" font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#5F564C">C</text><text x="191.67" y="132.32" font-size="22" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">20</text>

  <!-- portrait window rule: the wash bleeds, the ink holds the line -->
  <rect x="48" y="169" width="456" height="329" fill="none" stroke="#1A1714" stroke-width="2.4"/>

  <!-- the card's working text -->
  <g font-size="18">
    <text x="50" y="524" font-size="18" >Broad marsh-rigged wheels: may cross marsh at 1 hex</text>
    <text x="50" y="546" font-size="18" >per leg, which no other wheeled thing can do at all.</text>
  </g>
  <path d="M 48,594 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="616" font-size="16.5" >Wide-wheeled, willow-sprung, waterproofed with fen pitch.</text>
    <text x="50" y="635.5" font-size="16.5" >The Fenway crews sell the safe road through the Mirewash,</text>
    <text x="50" y="655" font-size="16.5" >and the toll is knowing which tussocks are lying.</text>
  </g>
</g>

<!-- ============================================================ GRIME -->
<g id="grime">
  <g fill="none" stroke="#1A1714" stroke-width="1" opacity="0.32"><path d="M 18,52 A 34,34 0 0 1 52,18"/><path d="M 500,18 A 34,34 0 0 1 534,52"/><path d="M 534,700 A 34,34 0 0 1 500,734"/><path d="M 52,734 A 34,34 0 0 1 18,700"/></g>
  <path d="M 0,0 H 92 Q 38,40 0,86 Z" fill="#1A1714" opacity="0.028"/>
  <path d="M 552,752 H 468 Q 516,718 552,676 Z" fill="#1A1714" opacity="0.025"/>
  <g fill="#1A1714" opacity="0.055">
    <circle cx="150" cy="700" r="1.4"/><circle cx="420" cy="112" r="1.2"/><circle cx="500" cy="470" r="1.3"/>
  </g>
  <circle cx="470" cy="676" r="26" fill="none" stroke="#D9CBAF" stroke-width="4" opacity="0.5"/>
</g>
</svg>
