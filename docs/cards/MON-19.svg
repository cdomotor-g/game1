<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 752" width="552" height="752" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>The Sirens — MON-19</title>
<desc>Monster card: The Sirens, air. Health 4, strength 2, armour 0, pace 1, yields at most 3 mana. Generated by tools/build-cards.mjs from data/*.json — do not edit. 63x88mm at 8 units/mm, 3mm bleed. Every number is a printed maximum in the summary strip; nothing on this card is walked by a token, because the tracks are on the player board. The portrait is cropped on the plate's subject, from docs/art/framing.json. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="portrait-window"><rect x="48" y="169" width="340.5" height="243"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="552" height="752" fill="#EDE4D1"/>
  <g clip-path="url(#portrait-window)">
    <image href="../art/renders/monster-sirens.png" x="48" y="49.89" width="340.5" height="481.22" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="48" y="106" width="71.83" height="36.8" rx="4" fill="#A33B26" opacity="0.55"/><rect x="124.83" y="106" width="71.83" height="36.8" rx="4" fill="#C4882B" opacity="0.55"/><rect x="201.67" y="106" width="71.83" height="36.8" rx="4" fill="#3C5A6E" opacity="0.55"/><rect x="278.5" y="106" width="71.83" height="36.8" rx="4" fill="#4C7A61" opacity="0.55"/><rect x="355.33" y="106" width="71.83" height="36.8" rx="4" fill="#6B4C7D" opacity="0.55"/><rect x="432.17" y="106" width="71.83" height="36.8" rx="4" fill="#D8CEBE" opacity="0.55"/><circle cx="468.0833333333333" cy="124.4" r="13.399999999999999" fill="#A0968A" opacity="0.5"/>
  <rect x="400.5" y="168.8" width="129.5" height="561.2" fill="#D8CEBE" opacity="0.5"/>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- timber-and-iron frame, rivets at the corners. Both rules follow the card's
       own corner radius, one inside the other, or the frame reads as a square
       box floating in a rounded card. -->
  <g fill="none" stroke="#1A1714">
    <rect x="32" y="32" width="488" height="688" rx="20" stroke-width="4"/>
    <rect x="40" y="40" width="472" height="672" rx="12" stroke-width="1.2"/>
  </g>
  <g><circle cx="47.4" cy="47.4" r="3.6"/><circle cx="504.6" cy="47.4" r="3.6"/><circle cx="47.4" cy="704.6" r="3.6"/><circle cx="504.6" cy="704.6" r="3.6"/></g>

  <!-- name and card code, maker's-mark small -->
  <text x="48" y="80" font-size="31" font-weight="bold">The Sirens</text>
  <text x="468" y="52" font-size="15" text-anchor="end" letter-spacing="2" font-family="Helvetica, Arial, sans-serif">MON-19</text>
  <g transform="translate(478 33.6) scale(1.08)" fill="none" stroke="#1A1714" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13C4 19 8 21 12 21S20 19 22 13ZM12 21V3M12 4H20V12H12"/></g>
  <text x="48" y="98" font-size="15.5" font-style="italic" fill="#3D3630">air · grassland, shallow-water</text>

  <!-- the summary strip: every number this card has, and none of them moves -->
  <rect x="48" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><text x="53" y="131.6" font-size="20" font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#5F564C">H</text><text x="114.83" y="132.32" font-size="22" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">4</text><rect x="124.83" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><text x="129.83" y="131.6" font-size="20" font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#5F564C">S</text><text x="191.67" y="132.32" font-size="22" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">2</text><rect x="201.67" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><text x="206.67" y="131.6" font-size="20" font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#5F564C">A</text><text x="268.5" y="132.32" font-size="22" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">0</text><rect x="278.5" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><text x="283.5" y="131.6" font-size="20" font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#5F564C">P</text><text x="345.33" y="132.32" font-size="22" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">1</text><rect x="355.33" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><text x="360.33" y="131.6" font-size="20" font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#5F564C">Y</text><text x="422.17" y="132.32" font-size="22" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">3</text><rect x="432.17" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><circle cx="468.0833333333333" cy="124.4" r="13.399999999999999" fill="none" stroke="#1A1714" stroke-width="2"/><g transform="translate(457.63 113.95) scale(0.87)" fill="none" stroke="#1A1714" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 7.6h9.4a2.6 2.6 0 1 0-2.6-2.6M3.6 12.8h12a2.8 2.8 0 1 1-2.8 2.8M3.6 18h7.6"/></g>

  <!-- portrait window rule: the wash bleeds, the ink holds the line -->
  <rect x="48" y="169" width="340.5" height="243" fill="none" stroke="#1A1714" stroke-width="2.4"/>

  <!-- the card's working text -->
  <g font-size="18">
    <text x="50" y="438" font-size="18" >Options: Slay. Run only if your pace</text>
    <text x="50" y="460" font-size="18" >beats 1.</text>
    <text x="50" y="482" font-size="18" >Slain, it yields the lesser of 3 and the</text>
    <text x="50" y="504" font-size="18" >purple die.</text>
    <text x="50" y="526" font-size="18" >The song. Any figure within a hex that</text>
    <text x="50" y="548" font-size="18" >can hear them goes to them and is lost.</text>
    <text x="50" y="570" font-size="18" >Wax in the ears - 1 honey, spent - or</text>
    <text x="50" y="592" font-size="18" >being bound to a mast by another figure</text>
    <text x="50" y="614" font-size="18" >is the only proof. A party that passes</text>
    <text x="50" y="636" font-size="18" >deaf has beaten them; nobody has ever</text>
    <text x="50" y="658" font-size="18" >fought them.</text>
  </g>
  <path d="M 394.5,168.8 V 702" stroke="#1A1714" stroke-width="1.2"/>
  <g transform="translate(421.71 702) rotate(-90)" font-style="italic" fill="#3D3630">
    <text x="0" y="0" font-size="16.5" >Two of them, in a meadow of flowers heaped with the bones and the</text>
    <text x="0" y="19.5" font-size="16.5" >shrivelled skin of the men who listened. They do not chase and they</text>
    <text x="0" y="39" font-size="16.5" >do not fly. They sing that they know everything that ever happened</text>
    <text x="0" y="58.5" font-size="16.5" >on the wide earth, and they sing it to you by name. Odysseus is the</text>
    <text x="0" y="78" font-size="16.5" >only man who heard it and lived, tied to the mast and begging to be</text>
  </g>
</g>

<!-- ============================================================ GRIME -->
<g id="grime">
  <g fill="none" stroke="#1A1714" stroke-width="1" opacity="0.32"><path d="M 18,52 A 34,34 0 0 1 52,18"/><path d="M 500,18 A 34,34 0 0 1 534,52"/><path d="M 534,700 A 34,34 0 0 1 500,734"/><path d="M 52,734 A 34,34 0 0 1 18,700"/></g>
  <path d="M 0,0 H 92 Q 38,40 0,86 Z" fill="#1A1714" opacity="0.028"/>
  <path d="M 552,752 H 468 Q 516,718 552,676 Z" fill="#1A1714" opacity="0.025"/>
  <g fill="#1A1714" opacity="0.055">
    <circle cx="150" cy="700" r="1.4"/><circle cx="420" cy="112" r="1.2"/><circle cx="500" cy="470" r="1.3"/>
  </g>
</g>
</svg>
