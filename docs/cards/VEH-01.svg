ize="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">8</text></g><text x="63" y="200" font-size="10" text-anchor="middle" letter-spacing="1.1" font-family="Helvetica, Arial, sans-serif" fill="#5F564C">DAMAGE</text>
  <rect x="474" y="208" width="30" height="368" fill="none" stroke="#1A1714" stroke-width="2"/><path d="M 474,530 H 504" stroke="#1A1714" stroke-width="1.1"/><path d="M 474,484 H 504" stroke="#1A1714" stroke-width="1.1"/><path d="M 474,438 H 504" stroke="#1A1714" stroke-width="1.1"/><path d="M 474,392 H 504" stroke="#1A1714" stroke-width="1.1"/><path d="M 474,346 H 504" stroke="#1A1714" stroke-width="1.1"/><path d="M 474,300 H 504" stroke="#1A1714" stroke-width="1.1"/><path d="M 474,254 H 504" stroke="#1A1714" stroke-width="1.1"/><g fill="#1A1714"><text x="489" y="557.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">5</text><text x="489" y="511.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">10</text><text x="489" y="465.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">15</text><text x="489" y="419.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">20</text><text x="489" y="373.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">25</text><text x="489" y="327.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">30</text><text x="489" y="281.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">35</text><text x="489" y="235.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">40</text></g><text x="489" y="200" font-size="10" text-anchor="middle" letter-spacing="1.1" font-family="Helvetica, Arial, sans-serif" fill="#5F564C">CARGO</text>

  <!-- the card's working text -->
  <g font-size="18">
    <text x="90" y="489" font-size="18" >+1 hex per leg, and she carries 4 passengers</text>
    <text x="90" y="511" font-size="18" >(figures or characters) free among the mail</text>
    <text x="90" y="533" font-size="18" >sacks.</text>
  </g>
  <path d="M 48,613.5 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="635.5" font-size="16.5" >The pride of the Steppe Line, polished brass and</text>
    <text x="50" y="655" font-size="16.5" >impatience. She has made Vossgard to Brassford in a day</text>
    <text x="50" y="674.5" font-size="16.5" >and a night, and the fireman has the burns to prove it.</text>
  </g>
