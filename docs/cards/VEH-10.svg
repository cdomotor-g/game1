<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 752" width="552" height="752" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Bay Courser — VEH-10</title>
<desc>Vehicle card: Bay Courser (mounted). Generated by tools/build-cards.mjs from data/*.json — do not edit. 63x88mm at 8 units/mm, 3mm bleed. The portrait is cropped on the plate's subject, from docs/art/framing.json. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="portrait-window"><rect x="88" y="182" width="376" height="281"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="552" height="752" fill="#EDE4D1"/>
  <g clip-path="url(#portrait-window)">
    <image href="../art/renders/vehicle-veh-10.png" x="65.25" y="182" width="421.5" height="281" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="48" y="208" width="30" height="368" fill="#A33B26" opacity="0.28"/>
  <rect x="474" y="208" width="30" height="368" fill="#3C5A6E" opacity="0.28"/>
  
  <rect x="24" y="609.5" width="504" height="120.5" fill="#D8CEBE" opacity="0.5"/>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- timber-and-iron frame, rivets at the corners -->
  <g fill="none" stroke="#1A1714">
    <rect x="32" y="32" width="488" height="688" stroke-width="4"/>
    <rect x="40" y="40" width="472" height="672" stroke-width="1.2"/>
  </g>
  <g>
    <circle cx="39" cy="39" r="3.6"/><circle cx="513" cy="39" r="3.6"/>
    <circle cx="39" cy="713" r="3.6"/><circle cx="513" cy="713" r="3.6"/>
  </g>

  <!-- name and card code, maker's-mark small -->
  <text x="48" y="80" font-size="31" font-weight="bold">Bay Courser</text>
  <text x="504" y="60" font-size="15" text-anchor="end" letter-spacing="2" font-family="Helvetica, Arial, sans-serif">VEH-10</text>
  <text x="48" y="102" font-size="15.5" font-style="italic" fill="#3D3630">horse</text>
  

  <!-- portrait window rule: the wash bleeds, the ink holds the line -->
  <rect x="88" y="182" width="376" height="281" fill="none" stroke="#1A1714" stroke-width="2.4"/>

  <rect x="48" y="208" width="30" height="368" fill="none" stroke="#1A1714" stroke-width="2"/><path d="M 48,484 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,526 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 48,392 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,434 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 48,300 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,342 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 47,250 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><g fill="#1A1714"><text x="66" y="534.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1</text><text x="66" y="442.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2</text><text x="66" y="350.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">3</text><text x="66" y="258.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">4</text></g><text x="63" y="200" font-size="10" text-anchor="middle" letter-spacing="1.1" font-family="Helvetica, Arial, sans-serif" fill="#5F564C">DAMAGE</text>
  <rect x="474" y="208" width="30" height="368" fill="none" stroke="#1A1714" stroke-width="2"/><path d="M 474,392 H 504" stroke="#1A1714" stroke-width="1.1"/><g fill="#1A1714"><text x="489" y="488.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1</text><text x="489" y="304.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2</text></g><text x="489" y="200" font-size="10" text-anchor="middle" letter-spacing="1.1" font-family="Helvetica, Arial, sans-serif" fill="#5F564C">CARGO</text>

  <!-- the card's working text -->
  <g font-size="18">
    <text x="90" y="489" font-size="18" >+1 hex on grassland legs. The fastest honest</text>
    <text x="90" y="511" font-size="18" >thing on four legs in the Reach.</text>
  </g>
  <path d="M 48,613.5 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="635.5" font-size="16.5" >A racing bay out of the Vossgard studs, all nerves and</text>
    <text x="50" y="655" font-size="16.5" >speed. She has carried three riders to fame and thrown two</text>
    <text x="50" y="674.5" font-size="16.5" >of them at the finish.</text>
  </g>
