    <text x="90" y="489" font-size="18" >+1 hex per leg, and she carries a rigged</text>
    <text x="90" y="511" font-size="18" >lantern: she may sail night legs at half</text>
    <text x="90" y="533" font-size="18" >speed.</text>
  </g>
  <path d="M 48,613.5 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="635.5" font-size="16.5" >A courier sloop built for the packet run, all sail and no</text>
    <text x="50" y="655" font-size="16.5" >patience. She has outrun two storms and one embargo, and</text>
    <text x="50" y="674.5" font-size="16.5" >her skipper mentions all three before you have sat down.</text>
