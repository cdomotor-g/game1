<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 752" width="552" height="752" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Dust Devil — MON-11</title>
<desc>Monster card: Dust Devil, air. Generated by tools/build-cards.mjs from data/*.json — do not edit. 63x88mm at 8 units/mm, 3mm bleed. The portrait is cropped on the plate's subject, from docs/art/framing.json. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="portrait-window"><rect x="88" y="150" width="376" height="282"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="552" height="752" fill="#EDE4D1"/>
  <g clip-path="url(#portrait-window)">
    <image href="../art/renders/monster-dust-devil.png" x="88" y="51.49" width="376" height="532.25" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="48" y="176" width="30" height="400" fill="#A33B26" opacity="0.28"/>
  <circle cx="70" cy="68" r="22" fill="#A0968A" opacity="0.5"/>
  <rect x="24" y="590" width="504" height="140" fill="#D8CEBE" opacity="0.5"/>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- timber-and-iron frame, rivets at the corners. Both rules follow the card's
       own corner radius, one inside the other, or the frame reads as a square
       box floating in a rounded card. -->
  <g fill="none" stroke="#1A1714">
    <rect x="32" y="32" width="488" height="688" rx="20" stroke-width="4"/>
    <rect x="40" y="40" width="472" height="672" rx="12" stroke-width="1.2"/>
  </g>
  <g><circle cx="47.4" cy="47.4" r="3.6"/><circle cx="504.6" cy="47.4" r="3.6"/><circle cx="47.4" cy="704.6" r="3.6"/><circle cx="504.6" cy="704.6" r="3.6"/></g>

  <!-- name and card code, maker's-mark small -->
  <text x="48" y="102" font-size="31" font-weight="bold">Dust Devil</text>
  <text x="504" y="60" font-size="15" text-anchor="end" letter-spacing="2" font-family="Helvetica, Arial, sans-serif">MON-11</text>
  <text x="48" y="124" font-size="15.5" font-style="italic" fill="#3D3630">strength 2 · yields 2 air mana · desert, grassland</text>
  <circle cx="70" cy="68" r="22" fill="none" stroke="#1A1714" stroke-width="2"/><g transform="translate(52.84 50.84) scale(1.43)" fill="none" stroke="#1A1714" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 7.6h9.4a2.6 2.6 0 1 0-2.6-2.6M3.6 12.8h12a2.8 2.8 0 1 1-2.8 2.8M3.6 18h7.6"/></g><text x="101" y="73" font-size="13" letter-spacing="1.5" font-family="Helvetica, Arial, sans-serif" fill="#3D3630">AIR</text>

  <!-- portrait window rule: the wash bleeds, the ink holds the line -->
  <rect x="88" y="150" width="376" height="282" fill="none" stroke="#1A1714" stroke-width="2.4"/>

  <rect x="48" y="176" width="30" height="400" fill="none" stroke="#1A1714" stroke-width="2"/><path d="M 48,476 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,522 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 48,376 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,422 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 48,276 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,322 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 47,222 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><g fill="#1A1714"><text x="66" y="530.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1</text><text x="66" y="430.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2</text><text x="66" y="330.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">3</text><text x="66" y="230.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">4</text></g><text x="63" y="168" font-size="10" text-anchor="middle" letter-spacing="1.1" font-family="Helvetica, Arial, sans-serif" fill="#5F564C">HEALTH</text>

  <!-- the card's working text -->
  <g font-size="18">
    <text x="90" y="458" font-size="18" >Options: Slay.</text>
  </g>
  <path d="M 48,594 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="616" font-size="16.5" >A standing twist of wind and grit with something like</text>
    <text x="50" y="635.5" font-size="16.5" >intent in it. You cannot chain the wind, feed it, or pen</text>
    <text x="50" y="655" font-size="16.5" >it - you can only take its mana off it, or take a</text>
    <text x="50" y="674.5" font-size="16.5" >different road. Slain, it drops whatever it was carrying:</text>
    <text x="50" y="694" font-size="16.5" >also gain 1d6 coin in scoured-clean scrap.</text>
  </g>
</g>

<!-- ============================================================ GRIME -->
<g id="grime">
  <g fill="none" stroke="#1A1714" stroke-width="1" opacity="0.32"><path d="M 18,52 A 34,34 0 0 1 52,18"/><path d="M 500,18 A 34,34 0 0 1 534,52"/><path d="M 534,700 A 34,34 0 0 1 500,734"/><path d="M 52,734 A 34,34 0 0 1 18,700"/></g>
  <path d="M 0,0 H 92 Q 38,40 0,86 Z" fill="#1A1714" opacity="0.028"/>
  <path d="M 552,752 H 468 Q 516,718 552,676 Z" fill="#1A1714" opacity="0.025"/>
  <g fill="#1A1714" opacity="0.055">
    <circle cx="150" cy="700" r="1.4"/><circle cx="420" cy="112" r="1.2"/><circle cx="500" cy="470" r="1.3"/>
  </g>
  <circle cx="470" cy="676" r="26" fill="none" stroke="#D9CBAF" stroke-width="4" opacity="0.5"/>
</g>
</svg>
