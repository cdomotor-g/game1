<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 752" width="552" height="752" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Weaver's Knot — TAL-02</title>
<desc>Talisman card: Weaver's Knot. An arcane subject - the mana bar rules in bruise. Generated by tools/build-cards.mjs from data/*.json — do not edit. 63x88mm at 8 units/mm, 3mm bleed. The portrait is cropped on the plate's subject, from docs/art/framing.json. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="portrait-window"><rect x="88" y="146" width="376" height="376"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="552" height="752" fill="#EDE4D1"/>
  <g clip-path="url(#portrait-window)">
    <image href="../art/renders/talisman-tal-02.png" x="31.11" y="103.24" width="470.94" height="470.94" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="474" y="172" width="30" height="404" fill="#6B4C7D" opacity="0.28"/>
  
  <rect x="24" y="609.5" width="504" height="120.5" fill="#D8CEBE" opacity="0.5"/>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- timber-and-iron frame, rivets at the corners. Both rules follow the card's
       own corner radius, one inside the other, or the frame reads as a square
       box floating in a rounded card. -->
  <g fill="none" stroke="#1A1714">
    <rect x="32" y="32" width="488" height="688" rx="20" stroke-width="4"/>
    <rect x="40" y="40" width="472" height="672" rx="12" stroke-width="1.2"/>
  </g>
  <g><circle cx="47.4" cy="47.4" r="3.6"/><circle cx="504.6" cy="47.4" r="3.6"/><circle cx="47.4" cy="704.6" r="3.6"/><circle cx="504.6" cy="704.6" r="3.6"/></g>

  <!-- name and card code, maker's-mark small -->
  <text x="48" y="80" font-size="31" font-weight="bold">Weaver's Knot</text>
  <text x="504" y="60" font-size="15" text-anchor="end" letter-spacing="2" font-family="Helvetica, Arial, sans-serif">TAL-02</text>
  <text x="48" y="102" font-size="15.5" font-style="italic" fill="#3D3630">talisman · made at the weaver · 45 coin · 0.5 kg</text>
  

  <!-- portrait window rule: the wash bleeds, the ink holds the line -->
  <rect x="88" y="146" width="376" height="376" fill="none" stroke="#1A1714" stroke-width="2.4"/>

  <rect x="474" y="172" width="30" height="404" fill="none" stroke="#1A1714" stroke-width="2"/><path d="M 474,441.33 H 504" stroke="#1A1714" stroke-width="1.1"/><path d="M 474,306.67 H 504" stroke="#1A1714" stroke-width="1.1"/><g fill="#1A1714"><text x="489" y="513.17" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1</text><text x="489" y="378.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2</text><text x="489" y="243.83" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">3</text></g><text x="489" y="164" font-size="10" text-anchor="middle" letter-spacing="1.1" font-family="Helvetica, Arial, sans-serif" fill="#5F564C">MANA</text>

  <!-- the card's working text -->
  <g font-size="18">
    <text x="90" y="548" font-size="18" >Stores up to 3 mana.</text>
  </g>
  <path d="M 48,613.5 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="635.5" font-size="16.5" >A cord tied in a knot with no beginning. Weavers make them</text>
    <text x="50" y="655" font-size="16.5" >in the winter and do not discuss the pattern.</text>
  </g>
</g>

<!-- ============================================================ GRIME -->
<g id="grime">
  <g fill="none" stroke="#1A1714" stroke-width="1" opacity="0.32"><path d="M 18,52 A 34,34 0 0 1 52,18"/><path d="M 500,18 A 34,34 0 0 1 534,52"/><path d="M 534,700 A 34,34 0 0 1 500,734"/><path d="M 52,734 A 34,34 0 0 1 18,700"/></g>
  <path d="M 0,0 H 92 Q 38,40 0,86 Z" fill="#1A1714" opacity="0.028"/>
  <path d="M 552,752 H 468 Q 516,718 552,676 Z" fill="#1A1714" opacity="0.025"/>
  <g fill="#1A1714" opacity="0.055">
    <circle cx="150" cy="700" r="1.4"/><circle cx="420" cy="112" r="1.2"/><circle cx="500" cy="470" r="1.3"/>
  </g>
  <circle cx="470" cy="676" r="26" fill="none" stroke="#D9CBAF" stroke-width="4" opacity="0.5"/>
</g>
</svg>
