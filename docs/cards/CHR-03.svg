  <!-- the card's working text -->
  <g font-size="18">
    <text x="90" y="522" font-size="18" >Greenwise: +1 on forage rolls, and Sylvae</text>
    <text x="90" y="544" font-size="18" >harvests arcane herbs without a knife.</text>
    <text x="90" y="566" font-size="18" >The wood remembers her: forest costs her</text>
    <text x="90" y="588" font-size="18" >party 1 to cross.</text>
