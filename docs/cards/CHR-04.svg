  <!-- the card's working text -->
  <g font-size="18">
    <text x="90" y="522" font-size="18" >Iron Stomach: Tilly and her party ignore</text>
    <text x="90" y="544" font-size="18" >illness event cards.</text>
    <text x="90" y="566" font-size="18" >Quartermaster: food carried by her party</text>
    <text x="90" y="588" font-size="18" >never perishes.</text>
  </g>
  <path d="M 48,613.5 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="635.5" font-size="16.5" >Tilly has fed harvest crews, armies and one very confused</text>
    <text x="50" y="655" font-size="16.5" >troll, and holds that there is no crisis a proper</text>
    <text x="50" y="674.5" font-size="16.5" >breakfast does not shrink. Her wagon's pantry defies</text>
    <text x="50" y="694" font-size="16.5" >several natural laws.</text>
