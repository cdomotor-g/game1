  <text x="504" y="60" font-size="15" text-anchor="end" letter-spacing="2" font-family="Helvetica, Arial, sans-serif">CHR-04</text>
  <text x="48" y="102" font-size="15.5" font-style="italic" fill="#3D3630">Halflings · Provisioner</text>
  

