<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 752" width="552" height="752" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Kindle — SPL-01</title>
<desc>Spell card: Kindle, fire. Costs 1 mana to cast. Generated by tools/build-cards.mjs from data/*.json — do not edit. 63x88mm at 8 units/mm, 3mm bleed. Every number is a printed maximum in the summary strip; nothing on this card is walked by a token, because the tracks are on the player board. The portrait is cropped on the plate's subject, from docs/art/framing.json. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="portrait-window"><rect x="48" y="169" width="456" height="344"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="552" height="752" fill="#EDE4D1"/>
  <g clip-path="url(#portrait-window)">
    <image href="../art/renders/spell-kindle.png" x="48" y="133.39" width="456" height="456" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="48" y="106" width="71.83" height="36.8" rx="4" fill="#6B4C7D" opacity="0.55"/><rect x="124.83" y="106" width="71.83" height="36.8" rx="4" fill="#D8CEBE" opacity="0.55"/><circle cx="160.75" cy="124.4" r="13.399999999999999" fill="#A33B26" opacity="0.5"/>
  <rect x="24" y="648.5" width="504" height="81.5" fill="#D8CEBE" opacity="0.5"/>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- timber-and-iron frame, rivets at the corners. Both rules follow the card's
       own corner radius, one inside the other, or the frame reads as a square
       box floating in a rounded card. -->
  <g fill="none" stroke="#1A1714">
    <rect x="32" y="32" width="488" height="688" rx="20" stroke-width="4"/>
    <rect x="40" y="40" width="472" height="672" rx="12" stroke-width="1.2"/>
  </g>
  <g><circle cx="47.4" cy="47.4" r="3.6"/><circle cx="504.6" cy="47.4" r="3.6"/><circle cx="47.4" cy="704.6" r="3.6"/><circle cx="504.6" cy="704.6" r="3.6"/></g>

  <!-- name and card code, maker's-mark small -->
  <text x="48" y="80" font-size="31" font-weight="bold">Kindle</text>
  <text x="504" y="52" font-size="15" text-anchor="end" letter-spacing="2" font-family="Helvetica, Arial, sans-serif">SPL-01</text>
  <text x="48" y="98" font-size="15.5" font-style="italic" fill="#3D3630">spell · fire</text>

  <!-- the summary strip: every number this card has, and none of them moves -->
  <rect x="48" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><text x="53" y="131.6" font-size="20" font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#5F564C">M</text><text x="114.83" y="132.32" font-size="22" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">1</text><rect x="124.83" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><circle cx="160.75" cy="124.4" r="13.399999999999999" fill="none" stroke="#1A1714" stroke-width="2"/><g transform="translate(150.3 113.95) scale(0.87)" fill="none" stroke="#1A1714" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20.6H20M12 5.6c2.9 4.4 3.5 6 3.5 8.6 0 3.6-2.5 5.1-3.5 6.2-1-1.1-3.5-2.6-3.5-6.2 0-2.6.6-4.2 3.5-8.6zM7.2 11.6c1.7 2.6 2.1 3.6 2.1 5.1 0 2.1-1.5 3.1-2.1 3.7-.6-.6-2.1-1.6-2.1-3.7 0-1.5.4-2.5 2.1-5.1zM16.8 11.6c1.7 2.6 2.1 3.6 2.1 5.1 0 2.1-1.5 3.1-2.1 3.7-.6-.6-2.1-1.6-2.1-3.7 0-1.5.4-2.5 2.1-5.1z"/></g>

  <!-- portrait window rule: the wash bleeds, the ink holds the line -->
  <rect x="48" y="169" width="456" height="344" fill="none" stroke="#1A1714" stroke-width="2.4"/>

  <!-- the card's working text -->
  <g font-size="18">
    <text x="50" y="539" font-size="18" >Light: the caster's party counts as carrying a torch</text>
    <text x="50" y="561" font-size="18" >until dawn (nothing to spend), or light any fire</text>
    <text x="50" y="583" font-size="18" >without fuel - a furnace so lit runs one batch</text>
    <text x="50" y="605" font-size="18" >without paying its fuel.</text>
  </g>
  <path d="M 48,652.5 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="674.5" font-size="16.5" >Every carter learns it before they learn to load, and</text>
    <text x="50" y="694" font-size="16.5" >every carter still packs the tinderbox.</text>
  </g>
</g>

<!-- ============================================================ GRIME -->
<g id="grime">
  <g fill="none" stroke="#1A1714" stroke-width="1" opacity="0.32"><path d="M 18,52 A 34,34 0 0 1 52,18"/><path d="M 500,18 A 34,34 0 0 1 534,52"/><path d="M 534,700 A 34,34 0 0 1 500,734"/><path d="M 52,734 A 34,34 0 0 1 18,700"/></g>
  <path d="M 0,0 H 92 Q 38,40 0,86 Z" fill="#1A1714" opacity="0.028"/>
  <path d="M 552,752 H 468 Q 516,718 552,676 Z" fill="#1A1714" opacity="0.025"/>
  <g fill="#1A1714" opacity="0.055">
    <circle cx="150" cy="700" r="1.4"/><circle cx="420" cy="112" r="1.2"/><circle cx="500" cy="470" r="1.3"/>
  </g>
</g>
</svg>
