  <!-- the card's working text -->
  <g font-size="13.5">
    <text x="90" y="446" font-size="13.5" >Ignores tundra penalties and forages for</text>
    <text x="90" y="464" font-size="13.5" >herself: no feed, ever.</text>
  </g>
  <path d="M 48,600 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="622" font-size="12.5" >Shaggy, short-legged, unimpressed. The steppe pony has</text>
    <text x="50" y="638.5" font-size="12.5" >carried the mail through three winters that killed</text>
    <text x="50" y="655" font-size="12.5" >better-looking horses, and her opinion of better-looking</text>
    <text x="50" y="671.5" font-size="12.5" >horses is on record.</text>
