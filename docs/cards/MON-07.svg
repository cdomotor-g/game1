  <rect x="88" y="150" width="376" height="282" fill="none" stroke="#1A1714" stroke-width="2.4"/>

  <rect x="48" y="176" width="30" height="400" fill="none" stroke="#1A1714" stroke-width="2"/><path d="M 48,509.33 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,538.67 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 48,442.67 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,472 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 48,376 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,405.33 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 48,309.33 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,338.67 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 48,242.67 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,272 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 47,205.33 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><g fill="#1A1714"><text x="66" y="547.17" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1</text><text x="66" y="480.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2</text><text x="66" y="413.83" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">3</text><text x="66" y="347.17" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">4</text><text x="66" y="280.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">5</text><text x="66" y="213.83" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">6</text></g><text x="63" y="168" font-size="10" text-anchor="middle" letter-spacing="1.1" font-family="Helvetica, Arial, sans-serif" fill="#5F564C">HEALTH</text>

  <!-- the card's working text -->
  <g font-size="18">
    <text x="90" y="458" font-size="18" >Options: Slay.</text>
  </g>
  <path d="M 48,594 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="616" font-size="16.5" >Where the fen path forks and one fork is dry, the dry fork</text>
    <text x="50" y="635.5" font-size="16.5" >is the Strangler. It is patient the way water is patient,</text>
    <text x="50" y="655" font-size="16.5" >and it has been fed by three generations of shortcuts.</text>
  </g>
