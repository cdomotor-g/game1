  <!-- name and card code, maker's-mark small -->
  <text x="48" y="102" font-size="31" font-weight="bold">Mire Strangler</text>
  <text x="504" y="60" font-size="15" text-anchor="end" letter-spacing="2" font-family="Helvetica, Arial, sans-serif">MON-07</text>
  <text x="48" y="124" font-size="15.5" font-style="italic" fill="#3D3630">strength 3 · yields 2 water mana · marsh</text>
  <circle cx="70" cy="68" r="22" fill="none" stroke="#1A1714" stroke-width="2"/><g transform="translate(52.84 50.84) scale(1.43)" fill="none" stroke="#1A1714" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 7.4q4.2-3.3 8.4 0t8.4 0M3.6 13.4q4.2-3.3 8.4 0t8.4 0M3.6 19.4q4.2-3.3 8.4 0t8.4 0"/></g><text x="101" y="73" font-size="13" letter-spacing="1.5" font-family="Helvetica, Arial, sans-serif" fill="#3D3630">WATER</text>

