  <g font-size="18">
    <text x="90" y="448" font-size="18" >Options: Slay · Domesticate.</text>
    <text x="90" y="470" font-size="18" >Domesticated: The grandest mount in the</text>
    <text x="90" y="492" font-size="18" >game: one character may ride it - day legs</text>
    <text x="90" y="514" font-size="18" >of 8 in any terrain, ignoring ground</text>
    <text x="90" y="536" font-size="18" >entirely. It eats 2 meat per round and will</text>
    <text x="90" y="558" font-size="18" >not enter a battle.</text>
  </g>
  <path d="M 48,590 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="612" font-size="16.5" >Its wingbeats are the weather two valleys over. Nobody has</text>
    <text x="50" y="631.5" font-size="16.5" >befriended one - the roc does not take gifts - but a bird</text>
    <text x="50" y="651" font-size="16.5" >beaten fairly and fed patiently has, three times in</text>
    <text x="50" y="670.5" font-size="16.5" >recorded history, decided a rider was worth carrying.</text>
  </g>
