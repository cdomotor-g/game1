<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 752" width="552" height="752" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Rime Harpy — MON-10</title>
<desc>Monster card: Rime Harpy, air. Generated by tools/build-cards.mjs from data/*.json — do not edit. 63x88mm at 8 units/mm, 3mm bleed. The ink plate alone is the black-and-white edition.</desc>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="552" height="752" fill="#EDE4D1"/>
  <image href="../art/renders/monster-rime-harpy.png" x="88" y="132" width="376" height="290" preserveAspectRatio="xMidYMid slice"/>
  <rect x="48" y="158" width="30" height="418" fill="#A33B26" opacity="0.28"/>
  <circle cx="64" cy="66" r="13" fill="#A0968A" opacity="0.55"/>
  <rect x="24" y="596" width="504" height="108" fill="#D8CEBE" opacity="0.5"/>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- timber-and-iron frame, rivets at the corners -->
  <g fill="none" stroke="#1A1714">
    <rect x="32" y="32" width="488" height="688" stroke-width="4"/>
    <rect x="40" y="40" width="472" height="672" stroke-width="1.2"/>
  </g>
  <g>
    <circle cx="39" cy="39" r="3.6"/><circle cx="513" cy="39" r="3.6"/>
    <circle cx="39" cy="713" r="3.6"/><circle cx="513" cy="713" r="3.6"/>
  </g>

  <!-- name and card code, maker's-mark small -->
  <text x="48" y="100" font-size="26" font-weight="bold">Rime Harpy</text>
  <text x="504" y="58" font-size="13" text-anchor="end" letter-spacing="2" font-family="Helvetica, Arial, sans-serif">MON-10</text>
  <text x="48" y="120" font-size="12.5" font-style="italic" fill="#3D3630">strength 2 · yields 1 air mana · tundra, mountain</text>
  <circle cx="64" cy="66" r="13" fill="none" stroke="#1A1714" stroke-width="2"/><text x="86" y="71" font-size="13" letter-spacing="1.5" font-family="Helvetica, Arial, sans-serif" fill="#3D3630">AIR</text>

  <!-- portrait window rule: the wash bleeds, the ink holds the line -->
  <rect x="88" y="132" width="376" height="290" fill="none" stroke="#1A1714" stroke-width="2.4"/>

  <rect x="48" y="158" width="30" height="418" fill="none" stroke="#1A1714" stroke-width="2"/><path d="M 48,492.4 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,530.1999999999999 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 48,408.8 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,446.6 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 48,325.20000000000005 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,363.00000000000006 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 48,241.60000000000002 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,279.40000000000003 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 47,195.8 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><g fill="#1A1714"><text x="66" y="538.2" font-size="12.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1</text><text x="66" y="454.6" font-size="12.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2</text><text x="66" y="371" font-size="12.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">3</text><text x="66" y="287.40000000000003" font-size="12.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">4</text><text x="66" y="203.8" font-size="12.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">5</text></g><text x="63" y="150" font-size="9" text-anchor="middle" letter-spacing="1.1" font-family="Helvetica, Arial, sans-serif" fill="#5F564C">HEALTH</text>

  <!-- the card's working text -->
  <g font-size="13.5">
    <text x="90" y="446" font-size="13.5" >Options: Slay · Enslave · Befriend.</text>
    <text x="90" y="464" font-size="13.5" >Gift to befriend: any 1 luxury commodity - it</text>
    <text x="90" y="482" font-size="13.5" >likes what glitters.</text>
    <text x="90" y="500" font-size="13.5" >Befriended: Once per round it flies a message or</text>
    <text x="90" y="518" font-size="13.5" >0.5 bulk between any two of your towns,</text>
    <text x="90" y="536" font-size="13.5" >instantly.</text>
  </g>
  <path d="M 48,600 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="622" font-size="12.5" >It nests in the wind-hollowed ice and collects what</text>
    <text x="50" y="638.5" font-size="12.5" >shines: coins, gems, buckles, once famously an entire</text>
    <text x="50" y="655" font-size="12.5" >surveyor's kit. Its voice is a dead friend's, badly</text>
    <text x="50" y="671.5" font-size="12.5" >rehearsed.</text>
  </g>
</g>

