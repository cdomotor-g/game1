<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 752" width="552" height="752" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Rime Harpy — MON-10</title>
<desc>Monster card: Rime Harpy, air. Generated by tools/build-cards.mjs from data/*.json — do not edit. 63x88mm at 8 units/mm, 3mm bleed. The portrait is cropped on the plate's subject, from docs/art/framing.json. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="portrait-window"><rect x="88" y="150" width="376" height="282"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="552" height="752" fill="#EDE4D1"/>
  <g clip-path="url(#portrait-window)">
    <image href="../art/renders/monster-rime-harpy.png" x="88" y="78.1" width="376" height="532.25" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="48" y="176" width="30" height="400" fill="#A33B26" opacity="0.28"/>
  <circle cx="64" cy="66" r="13" fill="#A0968A" opacity="0.55"/>
  <rect x="24" y="590" width="504" height="140" fill="#D8CEBE" opacity="0.5"/>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- timber-and-iron frame, rivets at the corners -->
  <g fill="none" stroke="#1A1714">
    <rect x="32" y="32" width="488" height="688" stroke-width="4"/>
    <rect x="40" y="40" width="472" height="672" stroke-width="1.2"/>
  </g>
  <g>
    <circle cx="39" cy="39" r="3.6"/><circle cx="513" cy="39" r="3.6"/>
    <circle cx="39" cy="713" r="3.6"/><circle cx="513" cy="713" r="3.6"/>
  </g>

  <!-- name and card code, maker's-mark small -->
  <text x="48" y="102" font-size="31" font-weight="bold">Rime Harpy</text>
  <text x="504" y="60" font-size="15" text-anchor="end" letter-spacing="2" font-family="Helvetica, Arial, sans-serif">MON-10</text>
  <text x="48" y="124" font-size="15.5" font-style="italic" fill="#3D3630">strength 2 · yields 1 air mana · tundra, mountain</text>
  <circle cx="64" cy="66" r="13" fill="none" stroke="#1A1714" stroke-width="2"/><text x="86" y="71" font-size="13" letter-spacing="1.5" font-family="Helvetica, Arial, sans-serif" fill="#3D3630">AIR</text>

  <!-- portrait window rule: the wash bleeds, the ink holds the line -->
  <rect x="88" y="150" width="376" height="282" fill="none" stroke="#1A1714" stroke-width="2.4"/>

  <rect x="48" y="176" width="30" height="400" fill="none" stroke="#1A1714" stroke-width="2"/><path d="M 48,496 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,532 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 48,416 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,452 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 48,336 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,372 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 48,256 H 78" stroke="#1A1714" stroke-width="1.1"/><path d="M 47,292 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><path d="M 47,212 l 5,4 l -5,4" fill="none" stroke="#1A1714" stroke-width="1.4"/><g fill="#1A1714"><text x="66" y="540.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1</text><text x="66" y="460.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2</text><text x="66" y="380.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">3</text><text x="66" y="300.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">4</text><text x="66" y="220.5" font-size="13.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">5</text></g><text x="63" y="168" font-size="10" text-anchor="middle" letter-spacing="1.1" font-family="Helvetica, Arial, sans-serif" fill="#5F564C">HEALTH</text>

  <!-- the card's working text -->
  <g font-size="18">
    <text x="90" y="458" font-size="18" >Options: Slay · Enslave · Befriend.</text>
    <text x="90" y="480" font-size="18" >Gift to befriend: any 1 luxury commodity -</text>
    <text x="90" y="502" font-size="18" >it likes what glitters.</text>
    <text x="90" y="524" font-size="18" >Befriended: Once per round it flies a</text>
    <text x="90" y="546" font-size="18" >message or 0.5 bulk between any two of your</text>
    <text x="90" y="568" font-size="18" >towns, instantly.</text>
  </g>
  <path d="M 48,594 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="616" font-size="16.5" >It nests in the wind-hollowed ice and collects what</text>
    <text x="50" y="635.5" font-size="16.5" >shines: coins, gems, buckles, once famously an entire</text>
    <text x="50" y="655" font-size="16.5" >surveyor's kit. Its voice is a dead friend's, badly</text>
    <text x="50" y="674.5" font-size="16.5" >rehearsed.</text>
  </g>
</g>

<!-- ============================================================ GRIME -->
<g id="grime">
  <path d="M 0,0 H 92 Q 38,40 0,86 Z" fill="#1A1714" opacity="0.028"/>
  <path d="M 552,752 H 468 Q 516,718 552,676 Z" fill="#1A1714" opacity="0.025"/>
  <g fill="#1A1714" opacity="0.055">
    <circle cx="150" cy="700" r="1.4"/><circle cx="420" cy="112" r="1.2"/><circle cx="500" cy="470" r="1.3"/>
  </g>
  <circle cx="470" cy="676" r="26" fill="none" stroke="#D9CBAF" stroke-width="4" opacity="0.5"/>
</g>
</svg>
