    <text x="90" y="522" font-size="18" >Wayfinder: +1 hex on any day leg that starts</text>
    <text x="90" y="544" font-size="18" >on a road.</text>
    <text x="90" y="566" font-size="18" >Knows the inns: resting costs Corin no coin,</text>
