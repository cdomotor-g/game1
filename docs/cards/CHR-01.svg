  <!-- the card's working text -->
  <g font-size="18">
    <text x="50" y="522" font-size="18" >Wayfinder: +1 hex on any day leg that starts on a</text>
    <text x="50" y="544" font-size="18" >road.</text>
    <text x="50" y="566" font-size="18" >Knows the inns: resting costs Corin no coin,</text>
    <text x="50" y="588" font-size="18" >anywhere.</text>
  </g>
  <path d="M 48,613.5 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="635.5" font-size="16.5" >Corin has walked every road on the map and several the map</text>
    <text x="50" y="655" font-size="16.5" >declines to show. They carry other people's letters, other</text>
    <text x="50" y="674.5" font-size="16.5" >people's debts, and a cloak that has been to more funerals</text>
    <text x="50" y="694" font-size="16.5" >than most priests.</text>
  </g>
