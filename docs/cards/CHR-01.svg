t x="359.33" y="122" width="34" height="34" rx="3" fill="none" stroke="#1A1714" stroke-width="0.9"/><text x="376.33" y="146.2" font-size="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">¤</text><text x="423.17" y="146.5" font-size="20.83" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">45</text><rect x="432.17" y="116" width="71.83" height="46" rx="5" fill="none" stroke="#1A1714" stroke-width="1.4"/><rect x="436.17" y="122" width="34" height="34" rx="3" fill="none" stroke="#1A1714" stroke-width="0.9"/><text x="453.17" y="146.2" font-size="17" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">KG</text><text x="500" y="146.92" font-size="22" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">9</text>

