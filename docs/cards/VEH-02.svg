    <text x="90" y="489" font-size="18" >Burns 1 extra coal per leg. Nothing else on</text>
    <text x="90" y="511" font-size="18" >rails carries close to her hundred bulk.</text>
  </g>
  <path d="M 48,613.5 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="635.5" font-size="16.5" >Twelve trucks and a boiler like a chapel. When the Hauler</text>
    <text x="50" y="655" font-size="16.5" >passes a village, the village comes out to watch; when she</text>
