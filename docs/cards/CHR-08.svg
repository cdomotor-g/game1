<desc>Character card: Old Mother Keswick, Hedge-Witch, strength 2. Health up the left edge, 8kg of burden up the right. Generated by tools/build-cards.mjs from data/*.json — do not edit. 63x88mm at 8 units/mm, 3mm bleed. The portrait is cropped on the plate's subject, from docs/art/framing.json. The ink plate alone is the black-and-white edition.</desc>
