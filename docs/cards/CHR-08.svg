    <text x="90" y="522" font-size="18" >Hedge Magic: spells cost Keswick 1 less</text>
    <text x="90" y="544" font-size="18" >mana, minimum 1.</text>
    <text x="90" y="566" font-size="18" >Second Sight: once per round she may look at</text>
    <text x="90" y="588" font-size="18" >the top card of the event deck.</text>
  </g>
  <path d="M 48,613.5 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="635.5" font-size="16.5" >Every fen village has a Mother Keswick and this is the one</text>
    <text x="50" y="655" font-size="16.5" >the others were named after. She trades in warts cursed,</text>
    <text x="50" y="674.5" font-size="16.5" >weather guessed and truths nobody thanked her for, and her</text>
    <text x="50" y="694" font-size="16.5" >bone charm was old when the Reach was young.</text>
