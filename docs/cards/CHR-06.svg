  <!-- the card's working text -->
  <g font-size="18">
    <text x="90" y="522" font-size="18" >Physician: once per round, cure one illness</text>
    <text x="90" y="544" font-size="18" >marker or restore 2 health, anywhere she</text>
    <text x="90" y="566" font-size="18" >stands - no infirmary needed.</text>
    <text x="90" y="588" font-size="18" >Her party ignores Camp Fever.</text>
  </g>
  <path d="M 48,613.5 H 504" stroke="#1A1714" stroke-width="1.2"/>
  <g font-style="italic" fill="#3D3630">
    <text x="50" y="635.5" font-size="16.5" >Trained at the Saltreach college, thrown out of it over a</text>
    <text x="50" y="655" font-size="16.5" >disagreement about leeches - she was against them. Her bag</text>
    <text x="50" y="674.5" font-size="16.5" >is oiled leather; her ledger lists every patient, and the</text>
    <text x="50" y="694" font-size="16.5" >margins list every fee still owed.</text>
