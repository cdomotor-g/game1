       own corner radius, one inside the other, or the frame reads as a square
       box floating in a rounded card. -->
  <g fill="none" stroke="#1A1714">
    <rect x="32" y="32" width="488" height="688" rx="20" stroke-width="4"/>
    <rect x="40" y="40" width="472" height="672" rx="12" stroke-width="1.2"/>
  </g>
  <g><circle cx="47.4" cy="47.4" r="3.6"/><circle cx="504.6" cy="47.4" r="3.6"/><circle cx="47.4" cy="704.6" r="3.6"/><circle cx="504.6" cy="704.6" r="3.6"/></g>

  <!-- name and card code, maker's-mark small -->
  <text x="48" y="80" font-size="31" font-weight="bold">Cinder Wolf</text>
  <text x="504" y="52" font-size="15" text-anchor="end" letter-spacing="2" font-family="Helvetica, Arial, sans-serif">MON-01</text>
  <text x="48" y="98" font-size="15.5" font-style="italic" fill="#3D3630">fire · desert, hills, grassland</text>

  <!-- the summary strip: every number this card has, and none of them moves -->
  <rect x="48" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><text x="53" y="131.6" font-size="20" font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#5F564C">H</text><text x="114.83" y="132.32" font-size="22" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">4</text><rect x="124.83" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><text x="129.83" y="131.6" font-size="20" font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#5F564C">S</text><text x="191.67" y="132.32" font-size="22" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">2</text><rect x="201.67" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><text x="206.67" y="131.6" font-size="20" font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#5F564C">D</text><text x="268.5" y="132.32" font-size="22" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">2</text><rect x="278.5" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><text x="283.5" y="131.6" font-size="20" font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#5F564C">Y</text><text x="345.33" y="132.32" font-size="22" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">1</text><rect x="355.33" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><circle cx="391.25" cy="124.4" r="13.399999999999999" fill="none" stroke="#1A1714" stroke-width="2"/><g transform="translate(380.8 113.95) scale(0.87)" fill="none" stroke="#1A1714" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20.6H20M12 5.6c2.9 4.4 3.5 6 3.5 8.6 0 3.6-2.5 5.1-3.5 6.2-1-1.1-3.5-2.6-3.5-6.2 0-2.6.6-4.2 3.5-8.6zM7.2 11.6c1.7 2.6 2.1 3.6 2.1 5.1 0 2.1-1.5 3.1-2.1 3.7-.6-.6-2.1-1.6-2.1-3.7 0-1.5.4-2.5 2.1-5.1zM16.8 11.6c1.7 2.6 2.1 3.6 2.1 5.1 0 2.1-1.5 3.1-2.1 3.7-.6-.6-2.1-1.6-2.1-3.7 0-1.5.4-2.5 2.1-5.1z"/></g>

  <!-- portrait window rule: the wash bleeds, the ink holds the line -->
  <rect x="48" y="169" width="360" height="375" fill="none" stroke="#1A1714" stroke-width="2.4"/>

  <!-- the card's working text -->
  <g font-size="18">
    <text x="50" y="570" font-size="18" >Options: Slay · Befriend · Domesticate.</text>
    <text x="50" y="592" font-size="18" >Gift to befriend: 2 meat, laid down and</text>
    <text x="50" y="614" font-size="18" >stepped away from.</text>
    <text x="50" y="636" font-size="18" >Domesticated: Runs with one travelling</text>
    <text x="50" y="658" font-size="18" >party: +1 hex on day legs, and bandits</text>
    <text x="50" y="680" font-size="18" >demand no toll.</text>
  </g>
  <path d="M 414,168.8 V 702" stroke="#1A1714" stroke-width="1.2"/>
  <g transform="translate(441.21 702) rotate(-90)" font-style="italic" fill="#3D3630">
    <text x="0" y="0" font-size="16.5" >A lean grey wolf with coals banked behind its ribs. Where the pack</text>
    <text x="0" y="19.5" font-size="16.5" >sleeps, the grass wears away in rings of ash, and shepherds learn to</text>
    <text x="0" y="39" font-size="16.5" >count their flock twice.</text>
  </g>
</g>

