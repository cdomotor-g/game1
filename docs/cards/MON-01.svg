  <rect x="0" y="0" width="552" height="752" fill="#EDE4D1"/>
  <g clip-path="url(#portrait-window)">
    <image href="../art/renders/monster-cinder-wolf.png" x="12" y="59.56" width="407.94" height="576.53" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="48" y="106" width="71.83" height="36.8" rx="4" fill="#A33B26" opacity="0.55"/><rect x="124.83" y="106" width="71.83" height="36.8" rx="4" fill="#C4882B" opacity="0.55"/><rect x="201.67" y="106" width="71.83" height="36.8" rx="4" fill="#3C5A6E" opacity="0.55"/><rect x="278.5" y="106" width="71.83" height="36.8" rx="4" fill="#6B4C7D" opacity="0.55"/><rect x="355.33" y="106" width="71.83" height="36.8" rx="4" fill="#D8CEBE" opacity="0.55"/><circle cx="391.25" cy="124.4" r="13.399999999999999" fill="#A33B26" opacity="0.5"/>
  <rect x="420" y="168.8" width="110" height="561.2" fill="#D8CEBE" opacity="0.5"/>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
