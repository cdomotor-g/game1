<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 752" width="552" height="752" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Ten Arrows — ITM-15</title>
<desc>Item card: Ten Arrows, gear. Worth 14, weighs 0.25kg, 5 of wear in it, carried in the carried slot. Generated by tools/build-cards.mjs from data/*.json — do not edit. 63x88mm at 8 units/mm, 3mm bleed. Every number is a printed maximum in the summary strip; nothing on this card is walked by a token, because the tracks are on the player board. The portrait is cropped on the plate's subject, from docs/art/framing.json. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="portrait-window"><rect x="48" y="169" width="360" height="309"/></clipPath>
</defs>

<!-- ============================================================ WASH -->
<g id="wash">
  <rect x="0" y="0" width="552" height="752" fill="#EDE4D1"/>
  <g clip-path="url(#portrait-window)">
    <image href="../../art/renders/item-arrows-10.png" x="48" y="143.5" width="360" height="360" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="48" y="106" width="71.83" height="36.8" rx="4" fill="#3C5A6E" opacity="0.55"/><rect x="124.83" y="106" width="71.83" height="36.8" rx="4" fill="#C4882B" opacity="0.55"/><rect x="201.67" y="106" width="71.83" height="36.8" rx="4" fill="#3C5A6E" opacity="0.55"/>
  <rect x="420" y="168.8" width="110" height="561.2" fill="#D8CEBE" opacity="0.5"/>
</g>

<!-- ============================================================ INK -->
<g id="ink" fill="#1A1714">
  <!-- timber-and-iron frame, rivets at the corners. Both rules follow the card's
       own corner radius, one inside the other, or the frame reads as a square
       box floating in a rounded card. -->
  <g fill="none" stroke="#1A1714">
    <rect x="32" y="32" width="488" height="688" rx="20" stroke-width="4"/>
    <rect x="40" y="40" width="472" height="672" rx="12" stroke-width="1.2"/>
  </g>
  <g><circle cx="47.4" cy="47.4" r="3.6"/><circle cx="504.6" cy="47.4" r="3.6"/><circle cx="47.4" cy="704.6" r="3.6"/><circle cx="504.6" cy="704.6" r="3.6"/></g>

  <!-- name and card code, maker's-mark small -->
  <text x="48" y="80" font-size="31" font-weight="bold">Ten Arrows</text>
  <text x="504" y="52" font-size="15" text-anchor="end" letter-spacing="2" font-family="Helvetica, Arial, sans-serif">ITM-15</text>
  <text x="48" y="98" font-size="15.5" font-style="italic" fill="#3D3630">gear · carried · made at the carpenter</text>

  <!-- the summary strip: every number this card has, and none of them moves -->
  <rect x="48" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><text x="53" y="131.6" font-size="20" font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#5F564C">W</text><text x="114.83" y="132.32" font-size="22" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">5</text><rect x="124.83" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><text x="129.83" y="131.6" font-size="20" font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#5F564C">¤</text><text x="191.67" y="132.32" font-size="22" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">14</text><rect x="201.67" y="106" width="71.83" height="36.8" rx="4" fill="none" stroke="#1A1714" stroke-width="1.4"/><text x="206.67" y="130.52" font-size="17" font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#5F564C">KG</text><text x="268.5" y="130.52" font-size="17" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">0.25</text>

  <!-- portrait window rule: the wash bleeds, the ink holds the line -->
  <rect x="48" y="169" width="360" height="309" fill="none" stroke="#1A1714" stroke-width="2.4"/>

  <!-- the card's working text -->
  <g font-size="18">
    <text x="50" y="504" font-size="18" >Shot from a quiver, and no use to anybody</text>
    <text x="50" y="526" font-size="18" >without one.</text>
    <text x="50" y="548" font-size="18" >Each battle with a bow or a crossbow</text>
    <text x="50" y="570" font-size="18" >spends 1, from the sheaf before the</text>
    <text x="50" y="592" font-size="18" >quiver.</text>
    <text x="50" y="614" font-size="18" >The uses ARE the wear: an empty sheaf is a</text>
    <text x="50" y="636" font-size="18" >spent sheaf.</text>
    <text x="50" y="658" font-size="18" >Made at the carpenter: 1 lumber · 1 h.</text>
  </g>
  <path d="M 414,168.8 V 702" stroke="#1A1714" stroke-width="1.2"/>
  <g transform="translate(441.21 702) rotate(-90)" font-style="italic" fill="#3D3630">
    <text x="0" y="0" font-size="16.5" >A sheaf of ten, bound at the neck with a twist of cord. An archer</text>
    <text x="0" y="19.5" font-size="16.5" >looses a dozen in a fight and walks the field afterwards for most of</text>
    <text x="0" y="39" font-size="16.5" >them; what this card counts is the two that split on a shield or go</text>
    <text x="0" y="58.5" font-size="16.5" >into the grass.</text>
  </g>
</g>

<!-- ============================================================ GRIME -->
<g id="grime">
  <g fill="none" stroke="#1A1714" stroke-width="1" opacity="0.32"><path d="M 18,52 A 34,34 0 0 1 52,18"/><path d="M 500,18 A 34,34 0 0 1 534,52"/><path d="M 534,700 A 34,34 0 0 1 500,734"/><path d="M 52,734 A 34,34 0 0 1 18,700"/></g>
  <path d="M 0,0 H 92 Q 38,40 0,86 Z" fill="#1A1714" opacity="0.028"/>
  <path d="M 552,752 H 468 Q 516,718 552,676 Z" fill="#1A1714" opacity="0.025"/>
  <g fill="#1A1714" opacity="0.055">
    <circle cx="150" cy="700" r="1.4"/><circle cx="420" cy="112" r="1.2"/><circle cx="500" cy="470" r="1.3"/>
  </g>
</g>
</svg>
