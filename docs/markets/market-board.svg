    <text x="88" y="1579.2" font-size="23.2" letter-spacing="6.4" font-family="Helvetica, Arial, sans-serif" fill="#5F564C">THE MARKET</text>
    <text x="360" y="1571.2" font-size="20">Town price = the commodity's base value × the band its token stands on.</text>
    <text x="360" y="1596" font-size="20">Buying from the board costs the spread on top; selling to it takes the spread off.</text>
    <text x="360" y="1620.8" font-size="20">Cargo that starts or ends on your own road or rail sells for a tenth more (rules.json infrastructure.haulage).</text>
    <text x="2336" y="1579.2" font-size="20" text-anchor="end" font-style="italic" fill="#3D3630">Prices drift in the Market phase, one family a town, one band.</text>
    <text x="2336" y="1619.2" font-size="18.4" text-anchor="end" letter-spacing="6.4" font-family="Helvetica, Arial, sans-serif" fill="#A0968A">game1 &#183; MARKET BOARD</text>
