<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2424 1728" width="2424" height="1728" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<title>Market Board</title>
<desc>One sheet of identical price ladders. Stand a commodity's token on a band and that is what the commodity is worth; move it as the market drifts. 16 identical price lines of 6 bands, and nothing on the sheet names a commodity: the token standing on a line is both the label and the reading. Generated by tools/build-market.mjs from data/marketboard.json, data/components.json and data/rules.json — do not edit. 297 x 210 mm at 8 units/mm, 3 mm bleed. The ink plate alone is the black-and-white edition.</desc>
<defs>
  <clipPath id="sheet"><rect x="24" y="24" width="2376" height="1680" rx="48" /></clipPath>
</defs>

