name: Fetch plate

# THE COURIER - RETIRED. Drawing on Hugging Face is retired (docs/MINT.md,
# docs/MINT-SETUP.md §4a): do not commission a plate through it and do not
# spend quota on it. The machinery is intact and works, so it is kept.
#
# It was the leg between a plate drawn on Hugging Face and docs/art/renders/,
# and it existed because that leg was the one part of the mint nobody could
# automate from a chat session: the agent that commissions a plate cannot reach
# huggingface.co (organisation egress policy), and the job that draws it cannot
# reach this repository without a credential nobody should be pasting into a
# conversation. A GitHub Action can reach both, so the token stays in Settings
# -> Secrets and variables -> Actions.
#
# Everything after the download is tools/ship-art.mjs, the same as the live
# route (.github/workflows/land-plate.yml) and the same as a person with a
# checkout. This workflow used to carry its own copy of the build list; two
# definitions of "landed" is one too many.
#
# It fetches the FULL plate, not a reduced one. Reduced copies only ever existed
# to squeeze a picture through a chat window, and nothing here has to.

on:
  workflow_dispatch:
    inputs:
      plate:
        description: 'Plate id, e.g. tile-warehouse or MOD-02'
        required: true
        type: string
      dataset:
        description: 'Hugging Face dataset holding the drawn plates'
        required: false
        default: 'cdomotor-g/game1-plates'
        type: string
      source:
        description: 'Path within the dataset. Defaults to <plate>.png'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: land-plate
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The plate itself, to a scratch path - never straight into the tree. A
      # private dataset needs the token; a public one ignores it. --fail so a
      # 404 stops the run here rather than handing ship-art an HTML error page
      # with a .png on the end of it.
      - name: Fetch the plate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PLATE: ${{ inputs.plate }}
          DATASET: ${{ inputs.dataset }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          src="${SOURCE:-}"
          [ -n "$src" ] || src="${PLATE}.png"
          url="https://huggingface.co/datasets/${DATASET}/resolve/main/${src}"
          echo "fetching ${url}"
          curl --fail --location --silent --show-error \
            ${HF_TOKEN:+--header "Authorization: Bearer ${HF_TOKEN}"} \
            --output "$RUNNER_TEMP/${PLATE}.png" "$url"

      # The wording a plate was actually drawn from, when it differs from the
      # brief. Absent in the dataset means the brief was used verbatim, which is
      # not an error.
      - name: Fetch the frozen wording, if there is any
        id: wording
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PLATE: ${{ inputs.plate }}
          DATASET: ${{ inputs.dataset }}
        run: |
          set -euo pipefail
          url="https://huggingface.co/datasets/${DATASET}/resolve/main/render/${PLATE}.txt"
          if curl --fail --location --silent --show-error \
               ${HF_TOKEN:+--header "Authorization: Bearer ${HF_TOKEN}"} \
               --output "$RUNNER_TEMP/${PLATE}.txt" "$url"; then
            echo "wording=--wording=$RUNNER_TEMP/${PLATE}.txt" >> "$GITHUB_OUTPUT"
            echo "froze the wording"
          else
            echo "wording=" >> "$GITHUB_OUTPUT"
            echo "no frozen wording — the brief was used as written"
          fi

      # Validate, floor, build, commit, push, read back, compare - all of it is
      # ship-art, and none of it is repeated here.
      - name: Ship it
        env:
          PLATE: ${{ inputs.plate }}
          WORDING: ${{ steps.wording.outputs.wording }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/ship-art.mjs "$PLATE" "$RUNNER_TEMP/$PLATE.png" --branch=main --quiet $WORDING

      - name: Ask Pages to redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main || echo "::warning::could not dispatch the Pages workflow; the site will catch up on the next push"
