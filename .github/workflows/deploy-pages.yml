name: Deploy web build to GitHub Pages

# The site is web/ served as-is: no framework, no npm install, all paths relative.
# The only build step is regenerating web/data/bundle.js from data/*.json, so the
# published explorer can never show stale numbers even if someone forgets to run
# build-data.mjs before committing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run in progress finish rather than cancelling it — a half-deployed site is
# worse than a slightly late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate data
        run: node tools/validate-data.mjs

      - name: Build web bundle
        run: node tools/build-data.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
